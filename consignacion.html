<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Consignación de Vehículo — PMT</title>

<link rel="stylesheet" href="styles.css">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>

<body>
<div class="contenedor">

<div class="header-top">
  <div class="logo-box"><img src="icons/icon-192.png"></div>
  <div class="titulos">
    <div class="titulos-linea1">CONSIGNACIÓN DE VEHÍCULO — PMT</div>
    <div class="titulos-linea3" id="fechaHora"></div>
    <div class="titulos-linea4">Sistema GELM 2026</div>
  </div>
  <div class="logo-box"><img src="icons/icon-512.png"></div>
</div>

<div class="panel">

<div class="section grid">
  <div><label>Placas</label><input id="placas"></div>
  <div><label>Marca</label><input id="marca"></div>
  <div><label>Tipo</label><input id="tipoVeh"></div>
  <div><label>Color</label><input id="color"></div>
  <div><label>NIT</label><input id="nit"></div>
  <div><label>Chasis</label><input id="chasis"></div>
</div>

<div class="section">
  <label>Motor</label>
  <input id="motor">
</div>

<div class="section">
  <label>Daños visibles del vehículo</label>
  <textarea id="danos" rows="2"></textarea>
</div>

<div class="section grid">
  <div><label>Lugar</label><input id="lugar"></div>
  <div><label>Motivo</label><input id="motivo"></div>
  <div><label>Consignado por</label><input id="consignado"></div>
  <div><label>Delegación</label><input id="delegacion"></div>
</div>

<div class="section grid">
  <div><label>Nombre del conductor</label><input id="conductor"></div>
  <div><label>Tipo Licencia</label><input id="tipoLic"></div>
  <div><label>No. Documento</label><input id="doc"></div>
  <div><label>No. Licencia</label><input id="lic"></div>
</div>

<div class="section">
  <label>Firma quien consigna</label>
  <canvas id="f1"></canvas>
</div>

<div class="section">
  <label>Firma del conductor</label>
  <canvas id="f2"></canvas>
</div>

<div class="section">
  <label>Firma guardián de turno</label>
  <canvas id="f3"></canvas>
</div>

<div class="actions">
  <button class="btn-save" onclick="guardar()">Guardar</button>
  <button class="btn-pdf" onclick="pdf()">PDF</button>
  <button class="btn-word" onclick="word()">Word</button>
  <button class="btn-excel" onclick="excel()">Excel</button>
  <button class="btn-del" onclick="borrar()">Borrar</button>
</div>

</div>
</div>

<script>
/* FECHA */
function actualizarHora(){
 const f=new Date();
 fechaHora.innerText=f.toLocaleString("es-GT");
}
setInterval(actualizarHora,1000); actualizarHora();

/* FIRMAS SEGURAS */
function firma(canvas){
 const ctx=canvas.getContext("2d");
 canvas.width=canvas.offsetWidth;
 canvas.height=120;
 let dib=false;
 canvas.addEventListener("pointerdown",e=>{dib=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY);});
 canvas.addEventListener("pointermove",e=>{if(dib){ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();}});
 canvas.addEventListener("pointerup",()=>dib=false);
 canvas.addEventListener("pointerleave",()=>dib=false);
}
firma(f1); firma(f2); firma(f3);

/* BASE */
const KEY="CONSIGNACION_PMT";
let db=JSON.parse(localStorage.getItem(KEY)||"[]");

/* GUARDAR */
function guardar(){
 const r={
  fecha:new Date().toLocaleString("es-GT"),
  placas:placas.value,
  marca:marca.value,
  tipo:tipoVeh.value,
  color:color.value,
  nit:nit.value,
  chasis:chasis.value,
  motor:motor.value,
  danos:danos.value,
  lugar:lugar.value,
  motivo:motivo.value,
  consignado:consignado.value,
  delegacion:delegacion.value,
  conductor:conductor.value,
  tipoLic:tipoLic.value,
  doc:doc.value,
  lic:lic.value,
  f1:f1.toDataURL(),
  f2:f2.toDataURL(),
  f3:f3.toDataURL()
 };
 db.push(r);
 localStorage.setItem(KEY,JSON.stringify(db));
 alert("Guardado correctamente");
}

/* PDF */
function pdf(){
 const {jsPDF}=window.jspdf;
 const d=new jsPDF();
 let y=20;
 d.text("CONSIGNACIÓN DE VEHÍCULO – PMT",105,10,{align:"center"});
 Object.entries(db[db.length-1]).forEach(([k,v])=>{
  if(!k.startsWith("f")){
   d.text(`${k.toUpperCase()}: ${v}`,10,y); y+=7;
  }
 });
 d.save("consignacion_pmt.pdf");
}

/* WORD */
function word(){
 let t="CONSIGNACIÓN DE VEHÍCULO – PMT\n\n";
 Object.entries(db[db.length-1]).forEach(([k,v])=>{
  if(!k.startsWith("f")) t+=`${k.toUpperCase()}: ${v}\n`;
 });
 const b=new Blob([t],{type:"application/msword"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(b);
 a.download="consignacion_pmt.doc";
 a.click();
}

/* EXCEL */
function excel(){
 const ws=XLSX.utils.json_to_sheet(db);
 const wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,ws,"Consignaciones");
 XLSX.writeFile(wb,"consignacion_pmt.xlsx");
}

/* BORRAR */
function borrar(){
 if(confirm("¿Borrar todo?")){
  db=[]; localStorage.removeItem(KEY);
 }
}
</script>
</body>
</html>
