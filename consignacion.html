<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Consignación de Vehículo — PMT | GELM 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- LIBRERÍAS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body{
  background:#050109;
  color:#e9f9ff;
  font-family:Segoe UI,system-ui;
  margin:0;
  padding:20px;
}
.panel{
  max-width:1100px;
  margin:auto;
  background:#020510;
  padding:25px;
  border-radius:22px;
  box-shadow:0 0 35px #00ffc8;
}
h1{text-align:center;color:#00ffc8;}
h3{color:#00ffc8;margin:22px 0 10px;}
label{font-size:.7rem;color:#9cb3d8;text-transform:uppercase;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
}

input,select,textarea{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #00ffc8;
  background:#000;
  color:#fff;
}
textarea{min-height:80px}

/* FIRMAS */
canvas{
  width:100%;
  height:160px;
  background:#fff;
  border-radius:12px;
  border:2px dashed #00ffc8;
  touch-action:none;
}

.actions{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;
  margin-top:20px;
}
button{
  padding:12px;
  border-radius:999px;
  border:none;
  font-weight:bold;
  cursor:pointer;
}
.btn-save{background:#00ffc8;}
.btn-pdf{background:#b000ff;color:#fff;}
.btn-word{background:#007bff;color:#fff;}
.btn-excel{background:#28a745;color:#fff;}
.btn-del{background:#ff0033;color:#fff;}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:22px;
  font-size:.8rem;
}
th{background:#00ffc8;color:#000;padding:6px;}
td{padding:6px;border-bottom:1px solid #333;}

footer{text-align:center;font-size:10px;opacity:.6;margin-top:18px;}
</style>
</head>

<body>
<div class="panel">
<h1>CONSIGNACIÓN DE VEHÍCULO — PMT</h1>

<!-- FECHA / HORA -->
<div class="grid">
  <div><label>Fecha</label><input type="date" id="fecha"></div>
  <div><label>Hora</label><input type="time" id="hora"></div>
  <div><label>Dirigido a</label><input id="dirigido" value="Juez de Asuntos Municipales y de Tránsito"></div>
</div>

<h3>Características del Vehículo</h3>
<div class="grid">
  <input id="placas" placeholder="Placas">
  <input id="marca" placeholder="Marca">
  <input id="tipo" placeholder="Tipo">
  <input id="color" placeholder="Color">
  <input id="nit" placeholder="NIT">
  <input id="chasis" placeholder="Chasis">
  <input id="motor" placeholder="Motor">
</div>

<h3>Accesorios</h3>
<textarea id="accesorios" placeholder="Detalle de accesorios y estado"></textarea>

<h3>Documentos Consignados</h3>
<textarea id="documentos" placeholder="Licencia, tarjeta, permiso, llaves, observaciones"></textarea>

<h3>Datos de Consignación</h3>
<div class="grid">
  <input id="lugar" placeholder="Lugar">
  <input id="motivo" placeholder="Motivo">
  <input id="consignado" placeholder="Consignado por">
  <input id="delegacion" placeholder="Delegación">
  <input id="boleta" placeholder="Boleta">
  <select id="grua">
    <option>NO</option>
    <option>SÍ</option>
  </select>
</div>

<h3>Datos del Conductor</h3>
<div class="grid">
  <input id="conductor" placeholder="Nombre del conductor">
  <input id="tipoLic" placeholder="Tipo de licencia">
  <input id="doc" placeholder="No. Documento">
  <input id="lic" placeholder="No. Licencia">
</div>

<h3>Daños visibles del vehículo</h3>
<textarea id="danos"></textarea>

<h3>Firmas</h3>
<div class="grid">
  <div><label>Firma quien consigna</label><canvas id="sig1"></canvas></div>
  <div><label>Firma del conductor</label><canvas id="sig2"></canvas></div>
  <div><label>Firma guardián de turno</label><canvas id="sig3"></canvas></div>
</div>

<div class="actions">
  <button class="btn-save" onclick="guardar()">Guardar</button>
  <button class="btn-pdf" onclick="pdf()">PDF</button>
  <button class="btn-word" onclick="word()">Word</button>
  <button class="btn-excel" onclick="excel()">Excel</button>
  <button class="btn-del" onclick="borrar()">Borrar</button>
</div>

<table>
<thead>
<tr><th>Fecha</th><th>Placas</th><th>Marca</th><th>Motivo</th></tr>
</thead>
<tbody id="tabla"></tbody>
</table>

<footer>© 2026 — Sistema GELM — PMT</footer>
</div>

<script>
const KEY="consignaciones_gelm_2026";
let db = JSON.parse(localStorage.getItem(KEY)||"[]");

/* ===== FIRMAS ===== */
function firma(id){
  const c=document.getElementById(id);
  const ctx=c.getContext("2d");
  function resize(){
    const r=c.getBoundingClientRect();
    c.width=r.width; c.height=r.height;
    ctx.lineWidth=2; ctx.lineCap="round";
  }
  resize(); window.addEventListener("resize",resize);
  let d=false;
  c.addEventListener("pointerdown",e=>{d=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY);});
  c.addEventListener("pointermove",e=>{if(d){ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();}});
  c.addEventListener("pointerup",()=>d=false);
  c.addEventListener("pointerleave",()=>d=false);
}
firma("sig1"); firma("sig2"); firma("sig3");

/* ===== GUARDAR ===== */
function guardar(){
  const r={
    fecha:fecha.value,
    hora:hora.value,
    placas:placas.value,
    marca:marca.value,
    tipo:tipo.value,
    color:color.value,
    nit:nit.value,
    chasis:chasis.value,
    motor:motor.value,
    accesorios:accesorios.value,
    documentos:documentos.value,
    lugar:lugar.value,
    motivo:motivo.value,
    consignado:consignado.value,
    delegacion:delegacion.value,
    boleta:boleta.value,
    grua:grua.value,
    conductor:conductor.value,
    tipoLic:tipoLic.value,
    doc:doc.value,
    lic:lic.value,
    danos:danos.value,
    firmas:{
      f1:sig1.toDataURL(),
      f2:sig2.toDataURL(),
      f3:sig3.toDataURL()
    }
  };
  if(!r.fecha||!r.placas){alert("Datos obligatorios");return;}
  db.push(r);
  localStorage.setItem(KEY,JSON.stringify(db));
  render();
}

/* ===== TABLA ===== */
function render(){
  tabla.innerHTML=db.map(x=>`
    <tr>
      <td>${x.fecha}</td>
      <td>${x.placas}</td>
      <td>${x.marca}</td>
      <td>${x.motivo}</td>
    </tr>`).join("");
}
render();

/* ===== PDF ===== */
function pdf(){
  const r=db.at(-1); if(!r) return;
  const {jsPDF}=window.jspdf;
  const d=new jsPDF({format:"letter"});
  let y=20;
  d.text("CONSIGNACIÓN DE VEHÍCULO — PMT",105,y,{align:"center"}); y+=10;
  d.setFontSize(10);
  for(const k in r){
    if(k==="firmas") continue;
    d.text(`${k.toUpperCase()}: ${r[k]}`,20,y); y+=6;
  }
  d.addImage(r.firmas.f1,"PNG",20,230,50,25);
  d.addImage(r.firmas.f2,"PNG",80,230,50,25);
  d.addImage(r.firmas.f3,"PNG",140,230,50,25);
  d.save("CONSIGNACION_PMT.pdf");
}

/* ===== WORD ===== */
function word(){
  const r=db.at(-1); if(!r) return;
  let t="CONSIGNACIÓN DE VEHÍCULO — PMT\n\n";
  for(const k in r){ if(k!=="firmas") t+=`${k.toUpperCase()}: ${r[k]}\n`; }
  const b=new Blob([t],{type:"application/msword"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b);
  a.download="CONSIGNACION_PMT.doc";
  a.click();
}

/* ===== EXCEL ===== */
function excel(){
  const data=db.map(x=>({...x,firmas:""}));
  const ws=XLSX.utils.json_to_sheet(data);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Consignaciones");
  XLSX.writeFile(wb,"CONSIGNACIONES_PMT.xlsx");
}

/* ===== BORRAR ===== */
function borrar(){
  if(confirm("¿Borrar todo?")){
    db=[]; localStorage.removeItem(KEY); render();
  }
}
</script>
</body>
</html>
