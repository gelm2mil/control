<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Consignación de Vehículo — PMT | GELM 2026</title>

<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body{background:#050109;color:#e9f9ff;font-family:system-ui}
.consignacion-box{max-width:420px;margin:auto;background:#020616;padding:18px;border-radius:22px;box-shadow:0 0 30px rgba(0,255,200,.4)}
h1{text-align:center;color:#00ffc8;font-size:1.4rem;margin:0}
.sub{text-align:center;color:#9cb3d8;font-size:.8rem;margin-bottom:18px}
.campo{margin-bottom:12px}
label{font-size:.7rem;color:#9cb3d8;text-transform:uppercase}
input,textarea{width:100%;padding:12px;border-radius:14px;border:1px solid rgba(0,255,200,.45);background:#020616;color:#fff}
textarea{min-height:80px}
.firma{margin-top:16px}
canvas{width:100%;height:180px;background:#fff;border-radius:14px;border:2px dashed #00ffc8;touch-action:none}
.botones{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
button{padding:14px;border-radius:999px;border:none;font-weight:bold}
.save{background:#00c98a}
.pdf{background:#b000ff;color:#fff}
.word{background:#2563eb;color:#fff}
.excel{background:#16a34a;color:#fff}
.del{background:#dc2626;color:#fff}
footer{text-align:center;font-size:.65rem;color:#9cb3d8;margin-top:14px}
</style>
</head>

<body>
<div class="consignacion-box">
<h1>CONSIGNACIÓN DE VEHÍCULO — PMT</h1>
<div class="sub">Juzgado de Asuntos Municipales y de Tránsito</div>

<div class="campo"><label>Fecha</label><input type="date" id="fecha"></div>
<div class="campo"><label>Hora</label><input type="time" id="hora"></div>

<div class="campo"><label>Placas</label><input id="placas"></div>
<div class="campo"><label>Marca</label><input id="marca"></div>
<div class="campo"><label>Tipo</label><input id="tipo"></div>
<div class="campo"><label>Color</label><input id="color"></div>

<div class="campo"><label>Motivo</label><input id="motivo"></div>

<div class="campo"><label>Conductor</label><input id="conductor"></div>
<div class="campo"><label>No. Licencia</label><input id="licencia"></div>

<div class="campo"><label>Daños</label><textarea id="danos"></textarea></div>

<div class="firma">
<label>Firma Guardián</label>
<canvas id="firma"></canvas>
</div>

<div class="botones">
<button class="save" onclick="guardar()">Guardar</button>
<button class="del" onclick="borrar()">Borrar</button>
<button class="pdf" onclick="exportarPDF()">PDF</button>
<button class="word" onclick="exportarWord()">Word</button>
<button class="excel" onclick="exportarExcel()">Excel</button>
</div>

<footer>© 2026 — Sistema GELM — PMT</footer>
</div>

<script>
const KEY="CONSIGNACION_PMT_GELM";
let db=JSON.parse(localStorage.getItem(KEY)||"[]");

/* ===== FIRMA ===== */
const canvas=document.getElementById("firma");
const ctx=canvas.getContext("2d");
canvas.width=canvas.offsetWidth; canvas.height=canvas.offsetHeight;
ctx.lineWidth=2; ctx.lineCap="round";
let dib=false;
canvas.onpointerdown=e=>{dib=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY);}
canvas.onpointermove=e=>{if(dib){ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();}}
canvas.onpointerup=()=>dib=false;

/* ===== GUARDAR ===== */
function guardar(){
  const r={
    fecha:fecha.value,
    hora:hora.value,
    placas:placas.value,
    marca:marca.value,
    tipo:tipo.value,
    color:color.value,
    motivo:motivo.value,
    conductor:conductor.value,
    licencia:licencia.value,
    danos:danos.value,
    firma:canvas.toDataURL("image/png")
  };
  db.push(r);
  localStorage.setItem(KEY,JSON.stringify(db));
  alert("✔ Registro guardado");
}

/* ===== PDF CON FIRMA ===== */
function exportarPDF(){
  const r=db.at(-1); if(!r) return;
  const {jsPDF}=window.jspdf;
  const d=new jsPDF();
  let y=20;
  d.text("CONSIGNACIÓN DE VEHÍCULO — PMT",105,y,{align:"center"}); y+=10;
  d.setFontSize(10);
  Object.entries(r).forEach(([k,v])=>{
    if(k==="firma") return;
    d.text(`${k.toUpperCase()}: ${v||""}`,20,y); y+=6;
  });
  d.addImage(r.firma,"PNG",60,y+10,90,30);
  d.save("consignacion_pmt.pdf");
}

/* ===== WORD COMPLETO ===== */
function exportarWord(){
  const r=db.at(-1); if(!r) return;
  const txt=`CONSIGNACIÓN DE VEHÍCULO – PMT

Fecha: ${r.fecha}
Hora: ${r.hora}
Placas: ${r.placas}
Marca: ${r.marca}
Tipo: ${r.tipo}
Color: ${r.color}
Motivo: ${r.motivo}

Conductor: ${r.conductor}
Licencia: ${r.licencia}

Daños:
${r.danos}
`;
  const b=new Blob([txt],{type:"application/msword"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b);
  a.download="consignacion_pmt.doc";
  a.click();
}

/* ===== EXCEL COMPLETO ===== */
function exportarExcel(){
  const ws=XLSX.utils.json_to_sheet(db);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Consignaciones");
  XLSX.writeFile(wb,"consignacion_pmt.xlsx");
}

/* ===== BORRAR ===== */
function borrar(){
  if(confirm("¿Borrar todo?")){
    db=[]; localStorage.removeItem(KEY);
    ctx.clearRect(0,0,canvas.width,canvas.height);
  }
}
</script>
</body>
</html>
