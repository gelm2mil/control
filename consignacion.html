<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Consignación de Vehículo — PMT | GELM 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- LIBRERÍAS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body{
  background:#050109;
  color:#e9f9ff;
  font-family:Segoe UI,system-ui;
  margin:0;
  padding:20px;
}
.panel{
  max-width:1100px;
  margin:auto;
  background:#020510;
  padding:25px;
  border-radius:22px;
  box-shadow:0 0 30px #00ffc8;
}
h1{text-align:center;color:#00ffc8;margin-bottom:5px;}
.sub{text-align:center;font-size:13px;color:#9cb3d8;margin-bottom:18px;}
h3{color:#00ffc8;margin:22px 0 10px;}
label{font-size:.7rem;color:#9cb3d8;text-transform:uppercase;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
}

input,textarea{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #00ffc8;
  background:#000;
  color:#fff;
}
textarea{min-height:90px}

canvas{
  width:100%;
  height:160px;
  background:#fff;
  border-radius:12px;
  border:2px dashed #00ffc8;
  touch-action:none;
}

.actions{
  display:grid;
  grid-template-columns:repeatrepeat(auto-fit,minmax(160px,1fr));
  gap:10px;
  margin-top:18px;
}

button{
  padding:12px;
  border-radius:999px;
  border:none;
  font-weight:bold;
  cursor:pointer;
}
.btn-save{background:#00ffc8;}
.btn-pdf{background:#b000ff;color:#fff;}
.btn-word{background:#007bff;color:#fff;}
.btn-excel{background:#28a745;color:#fff;}
.btn-month{background:#ffaa00;color:#000;}
.btn-del{background:#ff0033;color:#fff;}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:22px;
  font-size:.8rem;
}
th{background:#00ffc8;color:#000;padding:6px;}
td{padding:6px;border-bottom:1px solid #333;}

footer{text-align:center;font-size:10px;opacity:.6;margin-top:18px;}
</style>
</head>

<body>
<div class="panel">

<h1>CONSIGNACIÓN DE VEHÍCULO — PMT</h1>
<div class="sub">Dirigido a: Juzgado de Asuntos Municipales y de Tránsito</div>

<!-- FECHA / HORA -->
<div class="grid" style="grid-template-columns:1fr 1fr;">
  <div>
    <label>Fecha</label>
    <input type="date" id="fecha">
  </div>
  <div>
    <label>Hora</label>
    <input type="time" id="hora">
  </div>
</div>

<h3>Datos del Vehículo</h3>
<div class="grid">
  <input id="placas" placeholder="Placas">
  <input id="marca" placeholder="Marca">
  <input id="tipo" placeholder="Tipo">
  <input id="color" placeholder="Color">
  <input id="nit" placeholder="NIT">
  <input id="chasis" placeholder="Chasis">
  <input id="motor" placeholder="Motor">
</div>

<h3>Datos de Consignación</h3>
<div class="grid">
  <input id="lugar" placeholder="Lugar">
  <input id="motivo" placeholder="Motivo">
  <input id="consignado" placeholder="Consignado por">
  <input id="delegacion" placeholder="Delegación">
  <input id="boleta" placeholder="Boleta">
  <input id="grua" placeholder="Grúa (SI / NO)">
</div>

<h3>Conductor</h3>
<div class="grid">
  <input id="conductor" placeholder="Nombre del conductor">
  <input id="lic_tipo" placeholder="Tipo licencia">
  <input id="doc" placeholder="Documento">
  <input id="lic" placeholder="No. Licencia">
</div>

<h3>Daños visibles del vehículo</h3>
<textarea id="danos"></textarea>

<h3>Firmas</h3>
<div class="grid">
  <canvas id="f1"></canvas>
  <canvas id="f2"></canvas>
  <canvas id="f3"></canvas>
</div>

<div class="actions">
  <button class="btn-save" onclick="guardar()">Guardar</button>
  <button class="btn-pdf" onclick="pdf()">PDF</button>
  <button class="btn-word" onclick="word()">Word</button>
  <button class="btn-excel" onclick="excel()">Excel</button>
  <button class="btn-month" onclick="excelMes()">Excel por mes</button>
  <button class="btn-del" onclick="borrar()">Borrar</button>
</div>

<table>
<thead>
<tr>
  <th>#</th>
  <th>Fecha</th>
  <th>Hora</th>
  <th>Placas</th>
  <th>Marca</th>
  <th>Motivo</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

<footer>© 2026 — Sistema GELM — PMT</footer>
</div>

<script>
const KEY="CONSIGNACION_PMT_GELM";
let db=JSON.parse(localStorage.getItem(KEY)||"[]");

/* ===== FIRMA ESTABLE ===== */
function firma(id){
  const c=document.getElementById(id);
  const ctx=c.getContext("2d");
  const resize=()=>{
    const r=c.getBoundingClientRect();
    c.width=r.width; c.height=r.height;
    ctx.lineWidth=2; ctx.lineCap="round";
  };
  resize(); window.addEventListener("resize",resize);

  let d=false;
  c.addEventListener("pointerdown",e=>{
    e.preventDefault(); d=true;
    ctx.beginPath(); ctx.moveTo(e.offsetX,e.offsetY);
  });
  c.addEventListener("pointermove",e=>{
    if(!d) return;
    ctx.lineTo(e.offsetX,e.offsetY); ctx.stroke();
  });
  c.addEventListener("pointerup",()=>d=false);
  c.addEventListener("pointerleave",()=>d=false);
}
["f1","f2","f3"].forEach(firma);

/* ===== GUARDAR ===== */
function guardar(){
  if(!fecha.value||!placas.value){
    alert("Fecha y placas obligatorias");
    return;
  }

  const numero=db.length+1;

  const r={
    numero,
    fecha:fecha.value,
    hora:hora.value,
    placas:placas.value,
    marca:marca.value,
    tipo:tipo.value,
    color:color.value,
    nit:nit.value,
    chasis:chasis.value,
    motor:motor.value,
    lugar:lugar.value,
    motivo:motivo.value,
    consignado:consignado.value,
    delegacion:delegacion.value,
    boleta:boleta.value,
    grua:grua.value,
    conductor:{
      nombre:conductor.value,
      tipo:lic_tipo.value,
      doc:doc.value,
      lic:lic.value
    },
    danos:danos.value,
    firmas:[
      f1.toDataURL(),
      f2.toDataURL(),
      f3.toDataURL()
    ]
  };

  db.push(r);
  localStorage.setItem(KEY,JSON.stringify(db));
  render();
}

/* ===== TABLA ===== */
function render(){
  tabla.innerHTML=db.map(x=>`
    <tr>
      <td>${x.numero}</td>
      <td>${x.fecha}</td>
      <td>${x.hora}</td>
      <td>${x.placas}</td>
      <td>${x.marca}</td>
      <td>${x.motivo}</td>
    </tr>
  `).join("");
}
render();

/* ===== PDF ===== */
function pdf(){
  const r=db.at(-1); if(!r) return;
  const {jsPDF}=window.jspdf;
  const d=new jsPDF({format:"letter"});
  let y=20;

  d.text("CONSIGNACIÓN DE VEHÍCULO — PMT",105,y,{align:"center"}); y+=8;
  d.setFontSize(10);
  d.text("Dirigido a: Juzgado de Asuntos Municipales y de Tránsito",105,y,{align:"center"});
  y+=10;

  Object.entries({
    "No.":r.numero,
    Fecha:r.fecha,
    Hora:r.hora,
    Placas:r.placas,
    Marca:r.marca,
    Tipo:r.tipo,
    Color:r.color,
    NIT:r.nit,
    Chasis:r.chasis,
    Motor:r.motor,
    Lugar:r.lugar,
    Motivo:r.motivo,
    Conductor:r.conductor.nombre
  }).forEach(([k,v])=>{
    d.text(`${k}: ${v||""}`,20,y);
    y+=5;
  });

  d.text("Daños:",20,y); y+=5;
  d.text(r.danos||"",20,y,{maxWidth:170});

  d.addImage(r.firmas[0],"PNG",20,220,50,25);
  d.addImage(r.firmas[1],"PNG",80,220,50,25);
  d.addImage(r.firmas[2],"PNG",140,220,50,25);

  d.save("consignacion_pmt.pdf");
}

/* ===== WORD ===== */
function word(){
  const r=db.at(-1); if(!r) return;
  const t=`CONSIGNACIÓN DE VEHÍCULO — PMT
Dirigido a: Juzgado de Asuntos Municipales y de Tránsito

No.: ${r.numero}
Fecha: ${r.fecha}
Hora: ${r.hora}

Placas: ${r.placas}
Marca: ${r.marca}
Tipo: ${r.tipo}
Color: ${r.color}
NIT: ${r.nit}
Chasis: ${r.chasis}
Motor: ${r.motor}

Lugar: ${r.lugar}
Motivo: ${r.motivo}
Conductor: ${r.conductor.nombre}

Daños:
${r.danos}
`;
  const b=new Blob([t],{type:"application/msword"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b);
  a.download="consignacion_pmt.doc";
  a.click();
}

/* ===== EXCEL ===== */
function excel(){
  const ws=XLSX.utils.json_to_sheet(db);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Consignaciones");
  XLSX.writeFile(wb,"consignacion_pmt.xlsx");
}

/* ===== EXCEL POR MES ===== */
function excelMes(){
  const m=prompt("Mes (YYYY-MM):");
  if(!m) return;
  const f=db.filter(x=>x.fecha.startsWith(m));
  if(!f.length){alert("Sin registros");return;}
  const ws=XLSX.utils.json_to_sheet(f);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,m);
  XLSX.writeFile(wb,`consignacion_${m}.xlsx`);
}

/* ===== BORRAR ===== */
function borrar(){
  if(confirm("¿Borrar todo?")){
    db=[];
    localStorage.removeItem(KEY);
    render();
  }
}
</script>

</body>
</html>
