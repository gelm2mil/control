<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Consignación de Vehículo — PMT | GELM 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body{
  background:#050109;
  color:#000;
  font-family:Segoe UI,Arial;
  margin:0;
  padding:20px;
}
.panel{
  max-width:1000px;
  margin:auto;
  background:#fff;
  padding:25px;
  border-radius:10px;
}
h1{text-align:center;font-size:18px;margin:0}
.sub{text-align:center;font-size:12px;margin-bottom:12px}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:8px;
}
input,textarea{
  width:100%;
  padding:6px;
  border:1px solid #000;
  font-size:12px;
}
textarea{min-height:60px}

canvas{
  width:100%;
  height:120px;
  border:1px solid #000;
  background:#fff;
}

.actions{
  margin-top:15px;
  display:grid;
  gap:8px;
}
button{
  padding:10px;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>
<div class="panel">

<h1>POLICÍA MUNICIPAL DE TRÁNSITO</h1>
<div class="sub">Municipalidad de Chimaltenango – Consignación de Vehículo</div>

<div class="grid">
  <input type="date" id="fecha">
  <input type="time" id="hora">
</div>

<h3>Datos del Vehículo</h3>
<div class="grid">
  <input id="placas" placeholder="Placas">
  <input id="marca" placeholder="Marca">
  <input id="tipo" placeholder="Tipo">
  <input id="color" placeholder="Color">
  <input id="nit" placeholder="NIT">
  <input id="chasis" placeholder="Chasis">
  <input id="motor" placeholder="Motor">
</div>

<h3>Datos de Consignación</h3>
<div class="grid">
  <input id="lugar" placeholder="Lugar">
  <input id="motivo" placeholder="Motivo">
  <input id="consignado" placeholder="Consignado por">
  <input id="delegacion" placeholder="Delegación">
  <input id="boleta" placeholder="Boleta">
  <input id="grua" placeholder="Grúa">
</div>

<h3>Datos del Conductor</h3>
<div class="grid">
  <input id="conductor" placeholder="Nombre">
  <input id="lic_tipo" placeholder="Tipo licencia">
  <input id="doc" placeholder="Documento">
  <input id="lic" placeholder="No. Licencia">
</div>

<h3>Daños visibles</h3>
<textarea id="danos"></textarea>

<h3>Firmas</h3>
<div class="grid">
  <canvas id="f1" width="300" height="120"></canvas>
  <canvas id="f2" width="300" height="120"></canvas>
  <canvas id="f3" width="300" height="120"></canvas>
</div>

<div class="actions">
  <button onclick="exportarPDF()">GENERAR PDF OFICIAL</button>
</div>

</div>

<script>
function activarFirma(c){
  const ctx=c.getContext("2d");
  ctx.lineWidth=2;
  ctx.lineCap="round";
  let dib=false;

  c.addEventListener("pointerdown",e=>{
    dib=true;
    ctx.beginPath();
    ctx.moveTo(e.offsetX,e.offsetY);
  });
  c.addEventListener("pointermove",e=>{
    if(!dib) return;
    ctx.lineTo(e.offsetX,e.offsetY);
    ctx.stroke();
  });
  c.addEventListener("pointerup",()=>dib=false);
  c.addEventListener("pointerleave",()=>dib=false);
}
["f1","f2","f3"].forEach(id=>activarFirma(document.getElementById(id)));

function exportarPDF(){
  const {jsPDF}=window.jspdf;
  const d=new jsPDF({format:"letter"});
  let y=15;

  d.setFontSize(12);
  d.text("CONSIGNACIÓN DE VEHÍCULO – PMT",105,y,{align:"center"});
  y+=10;

  d.setFontSize(10);
  const datos=[
    ["Fecha",fecha.value],["Hora",hora.value],
    ["Placas",placas.value],["Marca",marca.value],
    ["Tipo",tipo.value],["Color",color.value],
    ["NIT",nit.value],["Chasis",chasis.value],
    ["Motor",motor.value],["Lugar",lugar.value],
    ["Motivo",motivo.value],
    ["Conductor",conductor.value],
    ["Licencia",lic_tipo.value],
    ["Documento",doc.value],
    ["No Licencia",lic.value]
  ];

  datos.forEach(dato=>{
    d.text(`${dato[0]}: ${dato[1]||""}`,20,y);
    y+=5;
  });

  d.text("Daños visibles:",20,y); y+=5;
  d.text(danos.value||"",20,y,{maxWidth:170});

  d.addImage(f1.toDataURL(),"PNG",20,220,50,20);
  d.addImage(f2.toDataURL(),"PNG",80,220,50,20);
  d.addImage(f3.toDataURL(),"PNG",140,220,50,20);

  d.save("CONSIGNACION_PMT_2026.pdf");
}
</script>

</body>
</html>
