<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Consignación de Vehículo — PMT | GELM 2026</title>

<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest-consignacion.json">
<meta name="theme-color" content="#00ffc8">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
.consignacion-box{
  background:rgba(0,0,0,.78);
  border-radius:22px;
  padding:22px;
  box-shadow:0 0 35px rgba(0,255,200,.45);
}

.titulo{text-align:center;color:#00ffc8;font-size:1.6rem}
.subtitulo{text-align:center;color:#9cb3d8;font-size:.85rem;margin-bottom:18px}

.campo{margin-bottom:14px}
.campo label{
  display:block;font-size:.75rem;color:#9cb3d8;
  margin-bottom:6px;text-transform:uppercase
}
.campo input,.campo textarea{
  width:100%;padding:14px;border-radius:999px;
  border:1px solid rgba(0,255,200,.45);
  background:#020616;color:#fff;font-size:1rem
}
.campo textarea{border-radius:16px;min-height:90px}

.firmas{margin-top:20px}
.firma-box{margin-bottom:18px}
.firma-box label{color:#00ffc8;font-size:.8rem}
canvas{
  width:100%;height:200px;background:#fff;
  border-radius:14px;border:2px dashed rgba(0,255,200,.9);
  touch-action:none
}

.botones{display:grid;gap:10px;margin-top:20px}
button{
  padding:14px;border-radius:999px;
  border:none;font-weight:bold;font-size:1rem
}
.save{background:#00c98a}
.update{background:#ffaa00}
.pdf{background:#b000ff;color:#fff}
.word{background:#007bff;color:#fff}
.excel{background:#28a745;color:#fff}
.danger{background:#ff0033;color:#fff}

.historial{margin-top:26px}
.item{
  background:rgba(0,255,200,.06);
  border:1px solid rgba(0,255,200,.3);
  border-radius:14px;
  padding:12px;
  margin-bottom:10px;
  cursor:pointer
}
.item small{color:#9cb3d8}
</style>
</head>

<body>
<div class="contenedor">
<div class="consignacion-box">

<div class="titulo">CONSIGNACIÓN DE VEHÍCULO — PMT</div>
<div class="subtitulo">Juzgado de Asuntos Municipales y de Tránsito</div>

<input type="hidden" id="editIndex">

<div class="campo"><label>Fecha</label><input type="date" id="fecha"></div>
<div class="campo"><label>Hora</label><input type="time" id="hora"></div>
<div class="campo"><label>Placas</label><input id="placas"></div>
<div class="campo"><label>Marca</label><input id="marca"></div>
<div class="campo"><label>Tipo</label><input id="tipo"></div>
<div class="campo"><label>Color</label><input id="color"></div>
<div class="campo"><label>NIT</label><input id="nit"></div>
<div class="campo"><label>Chasis</label><input id="chasis"></div>
<div class="campo"><label>Motor</label><input id="motor"></div>

<div class="campo"><label>Lugar</label><input id="lugar"></div>
<div class="campo"><label>Motivo</label><input id="motivo"></div>
<div class="campo"><label>Consignado por</label><input id="consignado"></div>
<div class="campo"><label>Delegación</label><input id="delegacion"></div>
<div class="campo"><label>Boleta</label><input id="boleta"></div>
<div class="campo"><label>Grúa</label><input id="grua"></div>

<div class="campo"><label>Nombre conductor</label><input id="conductor"></div>
<div class="campo"><label>Tipo licencia</label><input id="lic_tipo"></div>
<div class="campo"><label>Documento</label><input id="doc"></div>
<div class="campo"><label>No. Licencia</label><input id="lic"></div>
<div class="campo"><label>Daños</label><textarea id="danos"></textarea></div>

<div class="firmas">
  <div class="firma-box"><label>Firma quien consigna</label><canvas id="f1"></canvas></div>
  <div class="firma-box"><label>Firma conductor</label><canvas id="f2"></canvas></div>
  <div class="firma-box"><label>Firma guardián</label><canvas id="f3"></canvas></div>
</div>

<div class="botones">
  <button class="save" onclick="guardar()">Guardar</button>
  <button class="update" onclick="actualizar()">Actualizar</button>
  <button class="pdf" onclick="pdf()">PDF</button>
  <button class="word" onclick="word()">Word</button>
  <button class="excel" onclick="excel()">Excel</button>
  <button class="danger" onclick="borrarTodo()">Borrar todo</button>
</div>

<div class="historial" id="historial"></div>

</div>
</div>

<script>
const KEY="CONSIGNACION_PMT_GELM";
let db=JSON.parse(localStorage.getItem(KEY)||"[]");

function firma(id){
  const c=document.getElementById(id),ctx=c.getContext("2d");
  c.width=c.offsetWidth;c.height=c.offsetHeight;
  ctx.lineWidth=2;ctx.lineCap="round";
  let d=false;
  c.onpointerdown=e=>{d=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY)}
  c.onpointermove=e=>{if(d){ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke()}}
  c.onpointerup=()=>d=false
}
["f1","f2","f3"].forEach(firma);

function guardar(){
  const r=leer();
  db.push(r);
  localStorage.setItem(KEY,JSON.stringify(db));
  backupMensual(r);
  render();
}

function actualizar(){
  const i=editIndex.value;
  if(i==="")return alert("Seleccione un registro");
  db[i]=leer();
  localStorage.setItem(KEY,JSON.stringify(db));
  backupMensual(db[i]);
  editIndex.value="";
  render();
}

function leer(){
  return {
    fecha:fecha.value,hora:hora.value,placas:placas.value,marca:marca.value,
    tipo:tipo.value,color:color.value,nit:nit.value,chasis:chasis.value,
    motor:motor.value,lugar:lugar.value,motivo:motivo.value,
    consignado:consignado.value,delegacion:delegacion.value,
    boleta:boleta.value,grua:grua.value,
    conductor:{nombre:conductor.value,tipo:lic_tipo.value,doc:doc.value,lic:lic.value},
    danos:danos.value,
    firmas:[f1.toDataURL(),f2.toDataURL(),f3.toDataURL()]
  }
}

function render(){
  historial.innerHTML="";
  db.forEach((r,i)=>{
    const d=document.createElement("div");
    d.className="item";
    d.innerHTML=`<strong>${r.fecha}</strong> — ${r.placas}<br><small>${r.motivo}</small>`;
    d.onclick=()=>editar(i);
    historial.appendChild(d);
  });
}
render();

function editar(i){
  const r=db[i];editIndex.value=i;
  Object.assign(window,r,{});
}

function backupMensual(r){
  const m=r.fecha.slice(0,7);
  const K="CONSIGNACION_BACKUP_"+m;
  const b=JSON.parse(localStorage.getItem(K)||"[]");
  b.push(r);
  localStorage.setItem(K,JSON.stringify(b));
}

function borrarTodo(){
  if(confirm("¿Borrar todo?")){
    db=[];localStorage.removeItem(KEY);render()
  }
}
</script>
</body>
</html>
