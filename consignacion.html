<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Consignación de Vehículo — PMT | GELM 2026</title>

<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest-consignacion.json">
<meta name="theme-color" content="#00ffc8">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
/* ===== CONTENEDOR ===== */
.consignacion-box{
  background:rgba(0,0,0,.78);
  border-radius:22px;
  padding:18px;
  box-shadow:0 0 35px rgba(0,255,200,.45);
  max-width:520px;
  margin:auto;
}

/* ===== TITULOS ===== */
.titulo{
  text-align:center;
  color:#00ffc8;
  font-size:1.4rem;
}
.subtitulo{
  text-align:center;
  color:#9cb3d8;
  font-size:.8rem;
  margin-bottom:14px;
}

/* ===== CAMPOS TIPO AGENDA ===== */
.campo{
  margin-bottom:10px;
}
.campo label{
  display:block;
  font-size:.7rem;
  color:#00ffc8;
  margin-bottom:4px;
}
.campo input{
  width:100%;
  padding:12px;
  border-radius:999px;
  border:1px solid rgba(0,255,200,.45);
  background:#020616;
  color:#fff;
  font-size:.95rem;
}

/* ===== FIRMA ===== */
.firma-box{
  margin-top:14px;
}
.firma-box label{
  color:#00ffc8;
  font-size:.75rem;
}
.firma-box canvas{
  width:100%;
  height:180px;
  background:#fff;
  border-radius:14px;
  border:2px dashed rgba(0,255,200,.9);
  touch-action:none;
}

/* ===== BOTONES ===== */
.botones{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:16px;
}
.botones button{
  padding:14px;
  border-radius:999px;
  border:none;
  font-weight:600;
  font-size:.85rem;
}
.btn-save{background:#00c98a}
.btn-update{background:#8b5cf6}
.btn-pdf{background:#a855f7;color:#fff}
.btn-word{background:#2563eb;color:#fff}
.btn-excel{background:#16a34a;color:#fff}
.btn-em{background:#d97706;color:#000}
.btn-wm{background:#b45309;color:#fff}
.btn-del{background:#dc2626;color:#fff}

/* ===== HISTORIAL ===== */
.historial{
  margin-top:16px;
  font-size:.75rem;
}
.historial div{
  background:rgba(0,255,200,.08);
  padding:8px;
  border-radius:10px;
  margin-bottom:6px;
}
footer{
  text-align:center;
  font-size:10px;
  opacity:.6;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="consignacion-box">

<div class="titulo">CONSIGNACIÓN DE VEHÍCULO — PMT</div>
<div class="subtitulo">Juzgado de Asuntos Municipales y de Tránsito</div>

<div class="campo"><label>Fecha</label><input type="date" id="fecha"></div>
<div class="campo"><label>Hora</label><input type="time" id="hora"></div>
<div class="campo"><label>Placas</label><input id="placas"></div>
<div class="campo"><label>Marca</label><input id="marca"></div>
<div class="campo"><label>Motivo</label><input id="motivo"></div>

<div class="firma-box">
<label>Firma guardián</label>
<canvas id="firma"></canvas>
</div>

<div class="botones">
  <button class="btn-save" onclick="guardar()">Guardar</button>
  <button class="btn-update" onclick="actualizar()">Actualizar</button>

  <button class="btn-pdf" onclick="pdf()">PDF</button>
  <button class="btn-word" onclick="word()">Word</button>

  <button class="btn-excel" onclick="excel()">Excel</button>
  <button class="btn-em" onclick="excelMes()">E.M</button>

  <button class="btn-wm" onclick="wordMes()">W.M</button>
  <button class="btn-del" onclick="borrar()">Borrar</button>
</div>

<div class="historial" id="historial"></div>

<footer>© 2026 — Sistema GELM — PMT</footer>
</div>

<script>
const KEY="CONSIGNACION_PMT_GELM";
let db=JSON.parse(localStorage.getItem(KEY)||"[]");
let editIndex=null;

/* ===== FIRMA ===== */
const canvas=document.getElementById("firma");
const ctx=canvas.getContext("2d");
canvas.width=canvas.offsetWidth;
canvas.height=canvas.offsetHeight;
ctx.lineWidth=2;ctx.lineCap="round";
let draw=false;
canvas.addEventListener("pointerdown",e=>{draw=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY)});
canvas.addEventListener("pointermove",e=>{if(draw){ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke()}});
canvas.addEventListener("pointerup",()=>draw=false);

/* ===== GUARDAR ===== */
function guardar(){
  const r={
    fecha:fecha.value,
    hora:hora.value,
    placas:placas.value,
    marca:marca.value,
    motivo:motivo.value,
    firma:canvas.toDataURL()
  };
  db.push(r);
  localStorage.setItem(KEY,JSON.stringify(db));
  render();
}

/* ===== ACTUALIZAR ===== */
function actualizar(){
  if(editIndex===null) return alert("Seleccione un registro");
  db[editIndex]={
    fecha:fecha.value,
    hora:hora.value,
    placas:placas.value,
    marca:marca.value,
    motivo:motivo.value,
    firma:canvas.toDataURL()
  };
  localStorage.setItem(KEY,JSON.stringify(db));
  editIndex=null;
  render();
}

/* ===== RENDER ===== */
function render(){
  historial.innerHTML="";
  db.forEach((r,i)=>{
    const d=document.createElement("div");
    d.textContent=`${r.fecha} — ${r.placas} — ${r.motivo}`;
    d.onclick=()=>{
      editIndex=i;
      fecha.value=r.fecha;
      hora.value=r.hora;
      placas.value=r.placas;
      marca.value=r.marca;
      motivo.value=r.motivo;
    };
    historial.appendChild(d);
  });
}
render();

/* ===== EXPORTS ===== */
function pdf(){
  if(!db.length)return;
  const r=db.at(-1);
  const {jsPDF}=window.jspdf;
  const d=new jsPDF();
  d.text("CONSIGNACIÓN PMT",105,15,{align:"center"});
  d.text(`Fecha: ${r.fecha}`,20,30);
  d.text(`Placas: ${r.placas}`,20,38);
  d.addImage(r.firma,"PNG",20,50,80,30);
  d.save("consignacion.pdf");
}
function word(){
  if(!db.length)return;
  const r=db.at(-1);
  const b=new Blob([JSON.stringify(r,null,2)],{type:"application/msword"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download="consignacion.doc";a.click();
}
function excel(){
  const ws=XLSX.utils.json_to_sheet(db);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Consignaciones");
  XLSX.writeFile(wb,"consignacion.xlsx");
}
function excelMes(){
  const m=new Date().toISOString().slice(0,7);
  const f=db.filter(x=>x.fecha?.startsWith(m));
  if(!f.length)return alert("Sin datos del mes");
  const ws=XLSX.utils.json_to_sheet(f);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,m);
  XLSX.writeFile(wb,`consignacion_${m}.xlsx`);
}
function wordMes(){
  const m=new Date().toISOString().slice(0,7);
  const f=db.filter(x=>x.fecha?.startsWith(m));
  if(!f.length)return alert("Sin datos del mes");
  let t=`CONSIGNACIONES ${m}\n\n`;
  f.forEach(x=>t+=`${x.fecha} ${x.placas}\n`);
  const b=new Blob([t],{type:"application/msword"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download=`consignacion_${m}.doc`;a.click();
}
function borrar(){
  if(confirm("¿Borrar todo?")){
    db=[];localStorage.removeItem(KEY);render();
  }
}

/* ===== PWA ===== */
if("serviceWorker"in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
