<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Consignación de Vehículo — PMT | GELM 2026</title>

<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest-consignacion.json">
<meta name="theme-color" content="#00ffc8">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
.consignacion-box{
  background:rgba(0,0,0,.75);
  border-radius:20px;
  padding:18px;
  box-shadow:0 0 30px rgba(0,255,200,.45);
}
.titulo{text-align:center;color:#00ffc8;font-size:1.4rem}
.subtitulo{text-align:center;color:#9cb3d8;font-size:.85rem;margin-bottom:14px}

.tabla{width:100%;border-collapse:collapse;margin-bottom:14px}
.tabla th,.tabla td{
  border:1px solid rgba(0,255,200,.4);
  padding:6px;
  font-size:.85rem;
}
.tabla th{color:#00ffc8;background:rgba(0,255,200,.08)}

input,textarea{
  width:100%;
  background:#020616;
  border:none;
  color:#fff;
  padding:8px 10px;
  border-radius:14px;
}
textarea{min-height:70px}

.firma-box{margin-top:14px}
canvas{
  width:100%;height:180px;
  background:#fff;
  border-radius:14px;
  border:2px dashed rgba(0,255,200,.8);
}

.botones{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px;
}
button{
  padding:12px;
  border:none;
  border-radius:999px;
  font-weight:700;
}
.btn-save{background:#00c98a}
.btn-upd{background:#8b5cf6;color:#fff}
.btn-pdf{background:#9333ea;color:#fff}
.btn-word{background:#2563eb;color:#fff}
.btn-excel{background:#16a34a;color:#fff}
.btn-mes{background:#d97706;color:#000}
.btn-del{background:#dc2626;color:#fff}

.registros{
  margin-top:20px;
  font-size:.8rem;
}
.registros td{
  padding:8px;
  background:rgba(0,255,200,.05);
  border-radius:10px;
  margin-bottom:6px;
}
</style>
</head>

<body>
<div class="contenedor">
<div class="consignacion-box">

<div class="titulo">CONSIGNACIÓN DE VEHÍCULO — PMT</div>
<div class="subtitulo">Juzgado de Asuntos Municipales y de Tránsito</div>

<table class="tabla">
<tr><th>Fecha</th><td><input type="date" id="fecha"></td></tr>
<tr><th>Hora</th><td><input type="time" id="hora"></td></tr>
<tr><th>Placas</th><td><input id="placas"></td></tr>
<tr><th>Marca</th><td><input id="marca"></td></tr>
<tr><th>Motivo</th><td><input id="motivo"></td></tr>
</table>

<div class="firma-box">
<label>Firma Guardián</label>
<canvas id="firma"></canvas>
</div>

<div class="botones">
<button class="btn-save" onclick="guardar()">Guardar</button>
<button class="btn-upd" onclick="actualizar()">Actualizar</button>

<button class="btn-pdf" onclick="pdf()">PDF</button>
<button class="btn-word" onclick="word()">Word</button>

<button class="btn-excel" onclick="excel()">Excel</button>
<button class="btn-mes" onclick="excelMes()">E.M</button>

<button class="btn-mes" onclick="wordMes()">W.M</button>
<button class="btn-del" onclick="borrar()">Borrar</button>
</div>

<div class="registros" id="lista"></div>

</div>
</div>

<script>
const KEY="CONSIGNACION_PMT_GELM";
let db=JSON.parse(localStorage.getItem(KEY)||"[]");
let editIndex=null;

/* FIRMA */
const c=document.getElementById("firma"),ctx=c.getContext("2d");
c.width=c.offsetWidth;c.height=c.offsetHeight;
let draw=false;
c.addEventListener("pointerdown",e=>{draw=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY)});
c.addEventListener("pointermove",e=>{if(draw){ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke()}});
c.addEventListener("pointerup",()=>draw=false);

/* GUARDAR */
function guardar(){
  const r={
    fecha:fecha.value,
    hora:hora.value,
    placas:placas.value,
    marca:marca.value,
    motivo:motivo.value,
    firma:firma.toDataURL()
  };
  db.push(r);
  localStorage.setItem(KEY,JSON.stringify(db));
  render();
}

/* ACTUALIZAR */
function actualizar(){
  if(editIndex===null)return;
  db[editIndex]={
    fecha:fecha.value,
    hora:hora.value,
    placas:placas.value,
    marca:marca.value,
    motivo:motivo.value,
    firma:firma.toDataURL()
  };
  localStorage.setItem(KEY,JSON.stringify(db));
  editIndex=null;
  render();
}

/* RENDER */
function render(){
  lista.innerHTML="";
  db.forEach((r,i)=>{
    lista.innerHTML+=`
    <div onclick="editar(${i})">
      <strong>${r.fecha}</strong> — ${r.placas}<br>${r.motivo}
    </div>`;
  });
}
render();

function editar(i){
  const r=db[i];
  fecha.value=r.fecha;
  hora.value=r.hora;
  placas.value=r.placas;
  marca.value=r.marca;
  motivo.value=r.motivo;
  editIndex=i;
}

/* EXPORTES */
function ultimo(){return db.at(-1)}
function pdf(){
  const r=ultimo(); if(!r)return;
  const {jsPDF}=window.jspdf;
  const d=new jsPDF();
  d.text("CONSIGNACIÓN PMT",105,20,{align:"center"});
  d.text(`Fecha: ${r.fecha}`,20,40);
  d.text(`Placas: ${r.placas}`,20,50);
  d.text(`Motivo: ${r.motivo}`,20,60);
  d.addImage(r.firma,"PNG",20,80,60,30);
  d.save("consignacion.pdf");
}
function word(){
  const r=ultimo(); if(!r)return;
  const t=`CONSIGNACIÓN PMT\nFecha:${r.fecha}\nPlacas:${r.placas}\nMotivo:${r.motivo}`;
  const b=new Blob([t],{type:"application/msword"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b);
  a.download="consignacion.doc";
  a.click();
}
function excel(){
  const ws=XLSX.utils.json_to_sheet(db);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Consignaciones");
  XLSX.writeFile(wb,"consignacion.xlsx");
}
function excelMes(){
  const m=new Date().toISOString().slice(0,7);
  const f=db.filter(r=>r.fecha.startsWith(m));
  if(!f.length)return alert("Sin datos del mes");
  const ws=XLSX.utils.json_to_sheet(f);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,m);
  XLSX.writeFile(wb,`consignacion_${m}.xlsx`);
}
function wordMes(){
  const m=new Date().toISOString().slice(0,7);
  const f=db.filter(r=>r.fecha.startsWith(m));
  if(!f.length)return alert("Sin datos del mes");
  let t=`CONSIGNACIONES ${m}\n`;
  f.forEach(r=>t+=`${r.fecha} ${r.placas} ${r.motivo}\n`);
  const b=new Blob([t],{type:"application/msword"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b);
  a.download=`consignacion_${m}.doc`;
  a.click();
}
function borrar(){
  if(confirm("¿Borrar todo?")){
    db=[];
    localStorage.removeItem(KEY);
    render();
  }
}

/* SERVICE WORKER */
if("serviceWorker"in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>
