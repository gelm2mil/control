<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Consignación de Vehículo — PMT</title>

<link rel="stylesheet" href="styles.css">

<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>

<body>

<div class="contenedor">

<!-- ENCABEZADO -->
<div class="header-top">
  <div class="logo-box">
    <img src="icons/icon-192.png">
  </div>

  <div class="titulos">
    <div class="titulos-linea1">CONSIGNACIÓN DE VEHÍCULO — PMT</div>
    <div class="titulos-linea3" id="fechaHora"></div>
    <div class="titulos-linea4">Sistema GELM 2026</div>
  </div>

  <div class="logo-box">
    <img src="icons/icon-512.png">
  </div>
</div>

<div class="panel">

<!-- DATOS GENERALES -->
<div class="section grid">
  <div>
    <label>Fecha</label>
    <input id="fecha">
  </div>
  <div>
    <label>Juez de asuntos municipales y de tránsito</label>
    <input id="juez">
  </div>
</div>

<!-- VEHÍCULO -->
<div class="section grid">
  <div><label>Placas</label><input id="placas"></div>
  <div><label>Marca</label><input id="marca"></div>
  <div><label>Tipo</label><input id="tipoVeh"></div>
  <div><label>Color</label><input id="color"></div>
  <div><label>NIT</label><input id="nit"></div>
  <div><label>Chasis</label><input id="chasis"></div>
  <div><label>Motor</label><input id="motor"></div>
</div>

<!-- ACCESORIOS -->
<div class="section">
<label>Accesorios</label>
<div class="grid">
  <label><input type="checkbox" class="acc"> Llanta</label>
  <label><input type="checkbox" class="acc"> Retrovisores</label>
  <label><input type="checkbox" class="acc"> Antena</label>
  <label><input type="checkbox" class="acc"> Silbines</label>
  <label><input type="checkbox" class="acc"> Stop</label>
  <label><input type="checkbox" class="acc"> Herramienta</label>
  <label><input type="checkbox" class="acc"> Radio</label>
  <label><input type="checkbox" class="acc"> Bocinas</label>
  <label><input type="checkbox" class="acc"> Vidrios</label>
  <label><input type="checkbox" class="acc"> Plumillas</label>
  <label><input type="checkbox" class="acc"> Alfombras</label>
  <label><input type="checkbox" class="acc"> Placa vías</label>
</div>
</div>

<!-- DOCUMENTOS -->
<div class="section">
<label>Documentos consignados</label>
<div class="grid">
  <label><input type="checkbox" class="doc"> Licencia de conducir</label>
  <label><input type="checkbox" class="doc"> Tarjeta de circulación</label>
  <label><input type="checkbox" class="doc"> Permiso provisional</label>
  <label><input type="checkbox" class="doc"> Llaves del vehículo</label>
</div>
<textarea id="obsDocs" rows="2" placeholder="Observaciones"></textarea>
</div>

<!-- DATOS CONSIGNACIÓN -->
<div class="section grid">
  <div><label>Lugar</label><input id="lugar"></div>
  <div><label>Motivo</label><input id="motivo"></div>
  <div><label>Consignado por</label><input id="consignado"></div>
  <div><label>Delegación</label><input id="delegacion"></div>
  <div><label>Boleta de infracción</label><input id="boleta"></div>
  <div><label>Traslado grúa</label><input id="grua"></div>
</div>

<!-- CONDUCTOR -->
<div class="section grid">
  <div><label>Nombre del conductor</label><input id="conductor"></div>
  <div><label>Tipo licencia</label><input id="tipoLic"></div>
  <div><label>No. documento</label><input id="docu"></div>
  <div><label>No. licencia</label><input id="lic"></div>
</div>

<div class="section">
<label>Daños visibles del vehículo</label>
<textarea id="danos" rows="3"></textarea>
</div>

<!-- FIRMAS -->
<div class="section grid">
  <div>
    <label>Firma quien consigna</label>
    <canvas class="firma"></canvas>
  </div>
  <div>
    <label>Firma del conductor</label>
    <canvas class="firma"></canvas>
  </div>
  <div>
    <label>Firma guardián de turno</label>
    <canvas class="firma"></canvas>
  </div>
</div>

<div class="actions">
  <button class="btn-pdf" onclick="pdf()">PDF</button>
  <button class="btn-word" onclick="word()">Word</button>
  <button class="btn-excel" onclick="excel()">Excel</button>
</div>

<div class="pie">
© 2026 — Sistema GELM — Propiedad intelectual reservada
</div>

</div>
</div>

<script>
/* FECHA */
function actualizarHora(){
  const f=new Date();
  fechaHora.innerText=f.toLocaleString("es-GT");
}
setInterval(actualizarHora,1000);
actualizarHora();

/* FIRMAS */
document.querySelectorAll(".firma").forEach(c=>{
  const ctx=c.getContext("2d");
  let d=false;
  c.width=c.offsetWidth;
  c.height=120;
  c.onmousedown=e=>{d=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY);}
  c.onmousemove=e=>{if(d){ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();}}
  window.onmouseup=()=>d=false;
});

/* EXPORT */
function pdf(){
  const {jsPDF}=window.jspdf;
  const p=new jsPDF();
  p.text("CONSIGNACIÓN DE VEHÍCULO — PMT",105,15,{align:"center"});
  p.save("consignacion_pmt.pdf");
}
function word(){
  const b=new Blob([document.body.innerText],{type:"application/msword"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b);
  a.download="consignacion_pmt.doc";
  a.click();
}
function excel(){
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet([["Consignación PMT"]]);
  XLSX.utils.book_append_sheet(wb,ws,"Formulario");
  XLSX.writeFile(wb,"consignacion_pmt.xlsx");
}
</script>

</body>
</html>
