<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Consignación de Vehículo — GELM 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- LIBRERÍAS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ffc8">

<style>
body{
  background:#050109;
  color:#e9f9ff;
  font-family:Segoe UI,system-ui;
  margin:0;
  padding:20px;
}
.panel{
  max-width:1000px;
  margin:auto;
  background:#020510;
  padding:25px;
  border-radius:22px;
  box-shadow:0 0 30px #00ffc8;
}
h1{text-align:center;color:#00ffc8;}
h3{color:#00ffc8;margin:22px 0 10px;}
label{font-size:.7rem;color:#9cb3d8;text-transform:uppercase;}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
}

input,select,textarea{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #00ffc8;
  background:#000;
  color:#fff;
}

textarea{min-height:80px}

/* FIRMA */
canvas{
  width:100%;
  height:160px;
  background:#fff;
  border-radius:12px;
  border:2px dashed #00ffc8;
  touch-action:none;
}

.actions{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
  margin-top:15px;
}

button{
  padding:12px;
  border-radius:999px;
  border:none;
  font-weight:bold;
  cursor:pointer;
}
.btn-save{background:#00ffc8;}
.btn-pdf{background:#b000ff;color:#fff;}
.btn-word{background:#007bff;color:#fff;}
.btn-excel{background:#28a745;color:#fff;}
.btn-del{background:#ff0033;color:#fff;}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
  font-size:.75rem;
}
th{background:#00ffc8;color:#000;padding:6px;}
td{padding:6px;border-bottom:1px solid #333;}

footer{text-align:center;font-size:10px;opacity:.6;margin-top:18px;}
</style>
</head>

<body>
<div class="panel">
<h1>CONSIGNACIÓN DE VEHÍCULO — PMT</h1>

<!-- FECHA / HORA -->
<div class="grid">
  <div><label>Fecha</label><input type="date" id="fecha"></div>
  <div><label>Hora</label><input type="time" id="hora"></div>
</div>

<h3>Datos del Vehículo</h3>
<div class="grid">
  <input id="placas" placeholder="Placas">
  <input id="marca" placeholder="Marca">
  <input id="tipo" placeholder="Tipo">
  <input id="color" placeholder="Color">
  <input id="nit" placeholder="NIT">
  <input id="chasis" placeholder="Chasis">
  <input id="motor" placeholder="Motor">
</div>

<h3>Datos de Consignación</h3>
<div class="grid">
  <input id="lugar" placeholder="Lugar">
  <input id="motivo" placeholder="Motivo">
  <input id="consignado" placeholder="Consignado por">
  <input id="delegacion" placeholder="Delegación">
  <input id="boleta" placeholder="Boleta">
  <select id="grua">
    <option value="NO">Grúa: NO</option>
    <option value="SI">Grúa: SI</option>
  </select>
</div>

<h3>Conductor</h3>
<div class="grid">
  <input id="conductor" placeholder="Nombre del conductor">
  <input id="tipoLic" placeholder="Tipo licencia">
  <input id="doc" placeholder="Documento">
  <input id="lic" placeholder="No. Licencia">
</div>

<label>Daños visibles</label>
<textarea id="danos"></textarea>

<h3>Firmas</h3>
<div class="grid">
  <canvas id="sig1"></canvas>
  <canvas id="sig2"></canvas>
</div>

<div class="actions">
  <button class="btn-save" onclick="guardar()">Guardar</button>
  <button class="btn-pdf" onclick="pdf()">PDF</button>
  <button class="btn-word" onclick="word()">Word</button>
  <button class="btn-excel" onclick="excel()">Excel</button>
  <button class="btn-del" onclick="borrar()">Borrar</button>
</div>

<h3>Exportar por mes</h3>
<div class="grid">
  <input type="month" id="mesFiltro">
</div>

<div class="actions">
  <button class="btn-pdf" onclick="pdfMes()">PDF Mes</button>
  <button class="btn-word" onclick="wordMes()">Word Mes</button>
  <button class="btn-excel" onclick="excelMes()">Excel Mes</button>
</div>

<table>
<thead>
<tr>
<th>Fecha</th><th>Placas</th><th>Conductor</th><th>Motivo</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

<footer>© 2026 — Sistema GELM — PMT</footer>
</div>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}

const KEY="CONSIGNACIONES_GELM";
let db=JSON.parse(localStorage.getItem(KEY)||"[]");

/* FIRMAS */
function firma(id){
  const c=document.getElementById(id);
  const ctx=c.getContext("2d");
  function resize(){
    const r=c.getBoundingClientRect();
    c.width=r.width; c.height=r.height;
    ctx.lineWidth=2; ctx.lineCap="round";
  }
  resize(); window.addEventListener("resize",resize);
  let d=false;
  c.addEventListener("pointerdown",e=>{d=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY);});
  c.addEventListener("pointermove",e=>{if(d){ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();}});
  c.addEventListener("pointerup",()=>d=false);
}
firma("sig1"); firma("sig2");

function guardar(){
  const r={
    fecha:fecha.value,
    hora:hora.value,
    placas:placas.value,
    marca:marca.value,
    tipo:tipo.value,
    color:color.value,
    nit:nit.value,
    chasis:chasis.value,
    motor:motor.value,
    lugar:lugar.value,
    motivo:motivo.value,
    consignado:consignado.value,
    delegacion:delegacion.value,
    boleta:boleta.value,
    grua:grua.value,
    conductor:conductor.value,
    tipoLic:tipoLic.value,
    doc:doc.value,
    lic:lic.value,
    danos:danos.value,
    f1:sig1.toDataURL(),
    f2:sig2.toDataURL()
  };
  if(!r.fecha||!r.placas) return alert("Faltan datos");
  db.push(r);
  localStorage.setItem(KEY,JSON.stringify(db));
  render();
}

function render(){
  tabla.innerHTML=db.map(x=>`
    <tr><td>${x.fecha}</td><td>${x.placas}</td><td>${x.conductor}</td><td>${x.motivo}</td></tr>
  `).join("");
}
render();

function pdf(){
  const {jsPDF}=window.jspdf;
  const r=db.at(-1); if(!r) return;
  const d=new jsPDF();
  let y=20;
  d.text("CONSIGNACIÓN PMT",105,y,{align:"center"}); y+=10;
  Object.entries(r).forEach(([k,v])=>{
    if(!k.startsWith("f")){ d.text(`${k}: ${v}`,20,y); y+=6;}
  });
  d.addImage(r.f1,"PNG",20,200,70,30);
  d.addImage(r.f2,"PNG",120,200,70,30);
  d.save("consignacion.pdf");
}

function word(){
  const r=db.at(-1); if(!r) return;
  let t="CONSIGNACIÓN PMT\n\n";
  Object.entries(r).forEach(([k,v])=>{
    if(!k.startsWith("f")) t+=`${k}: ${v}\n`;
  });
  const b=new Blob([t],{type:"application/msword"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b);
  a.download="consignacion.doc";
  a.click();
}

function excel(){
  const ws=XLSX.utils.json_to_sheet(db);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Consignaciones");
  XLSX.writeFile(wb,"consignaciones.xlsx");
}

function filtrarMes(){
  const m=mesFiltro.value;
  if(!m) return [];
  return db.filter(x=>x.fecha.startsWith(m));
}

function pdfMes(){
  const datos=filtrarMes(); if(!datos.length) return alert("Sin datos");
  const {jsPDF}=window.jspdf;
  const d=new jsPDF(); let y=20;
  d.text("REPORTE MENSUAL",105,y,{align:"center"}); y+=10;
  datos.forEach((r,i)=>{d.text(`${i+1}. ${r.fecha} ${r.placas}`,20,y); y+=6;});
  d.save("mensual.pdf");
}

function wordMes(){
  const datos=filtrarMes(); if(!datos.length) return;
  let t="REPORTE MENSUAL\n\n";
  datos.forEach(r=>t+=`${r.fecha} ${r.placas}\n`);
  const b=new Blob([t],{type:"application/msword"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b);
  a.download="mensual.doc";
  a.click();
}

function excelMes(){
  const datos=filtrarMes(); if(!datos.length) return;
  const ws=XLSX.utils.json_to_sheet(datos);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Mes");
  XLSX.writeFile(wb,"mensual.xlsx");
}

function borrar(){
  if(confirm("¿Borrar todo?")){
    db=[]; localStorage.removeItem(KEY); render();
  }
}
</script>
</body>
</html>
