<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Consignación de Vehículo — GELM SYSTEM 2026</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ffc8">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body{background:#050109;color:#fff;font-family:system-ui}
.contenedor{max-width:520px;margin:auto;padding:20px}
.consignacion-box{
  background:rgba(0,0,0,.75);
  border-radius:22px;padding:20px;
  box-shadow:0 0 35px rgba(0,255,200,.4)
}
.titulo{text-align:center;color:#00ffc8;font-size:1.4rem}
.subtitulo{text-align:center;color:#9cb3d8;font-size:.85rem;margin-bottom:16px}
.campo{margin-bottom:12px}
label{font-size:.7rem;color:#9cb3d8;text-transform:uppercase}
input,textarea{
  width:100%;padding:14px;border-radius:14px;
  border:1px solid rgba(0,255,200,.45);
  background:#020616;color:#fff
}
textarea{min-height:90px}
.seccion{margin-top:20px;border-top:1px solid rgba(0,255,200,.3);padding-top:10px}
.seccion h3{color:#00ffc8;font-size:.75rem}
canvas{
  width:100%;height:180px;background:#fff;
  border-radius:14px;border:2px dashed #00ffc8;
  touch-action:none
}
.botones{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px
}
button{
  padding:14px;border-radius:999px;border:none;font-weight:bold;cursor:pointer
}
.btn-save{background:#00c98a}
.btn-pdf{background:#b000ff;color:#fff}
.btn-word{background:#007bff;color:#fff}
.btn-excel{background:#28a745;color:#fff}
.btn-del{background:#ff0033;color:#fff;grid-column:1/-1}
.registros{margin-top:22px;font-size:.75rem}
.registros div{padding:6px;border-bottom:1px solid rgba(0,255,200,.25)}
footer{text-align:center;font-size:10px;opacity:.6;margin-top:14px}
</style>
</head>

<body>
<div class="contenedor">
<div class="consignacion-box">

<div class="titulo">CONSIGNACIÓN DE VEHÍCULO</div>
<div class="subtitulo">GELM SYSTEM 2026 — PMT</div>

<div class="campo"><label>Fecha</label><input type="date" id="fecha"></div>
<div class="campo"><label>Hora</label><input type="time" id="hora"></div>

<div class="seccion"><h3>Vehículo</h3>
<input id="placas" placeholder="Placas">
<input id="marca" placeholder="Marca">
<input id="tipo" placeholder="Tipo">
<input id="color" placeholder="Color">
<input id="nit" placeholder="NIT">
<input id="chasis" placeholder="Chasis">
<input id="motor" placeholder="Motor">
</div>

<div class="seccion"><h3>Consignación</h3>
<input id="lugar" placeholder="Lugar">
<input id="motivo" placeholder="Motivo">
<input id="consignado" placeholder="Consignado por">
<input id="delegacion" placeholder="Delegación">
<input id="boleta" placeholder="Boleta">
<input id="grua" placeholder="Grúa">
</div>

<div class="seccion"><h3>Conductor</h3>
<input id="conductor" placeholder="Nombre">
<input id="lic_tipo" placeholder="Tipo Licencia">
<input id="doc" placeholder="Documento">
<input id="lic" placeholder="No. Licencia">
</div>

<div class="seccion"><h3>Daños</h3>
<textarea id="danos"></textarea>
</div>

<div class="seccion"><h3>Firmas</h3>
<canvas id="f1"></canvas>
<canvas id="f2"></canvas>
<canvas id="f3"></canvas>
</div>

<div class="botones">
<button class="btn-save" onclick="guardar()">Guardar</button>
<button class="btn-pdf" onclick="pdf()">PDF</button>
<button class="btn-word" onclick="word()">Word</button>
<button class="btn-excel" onclick="excel()">Excel</button>
<button class="btn-del" onclick="borrar()">Borrar</button>
</div>

<div class="registros" id="tabla"></div>
<footer>© 2026 — GELM SYSTEM</footer>

</div>
</div>

<script>
/* ================= INDEXED DB ================= */
let DB;
const req=indexedDB.open("GELM-DB-2026",2);

req.onupgradeneeded=e=>{
  DB=e.target.result;
  if(!DB.objectStoreNames.contains("consignaciones")){
    DB.createObjectStore("consignaciones",{keyPath:"id",autoIncrement:true});
  }
};
req.onsuccess=e=>{DB=e.target.result;render();};

/* ================= FIRMA ================= */
function firma(id){
  const c=document.getElementById(id),ctx=c.getContext("2d");
  let d=false;
  function r(){c.width=c.offsetWidth;c.height=c.offsetHeight;ctx.lineWidth=2}
  r();window.addEventListener("resize",r);
  c.onpointerdown=e=>{d=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY)}
  c.onpointermove=e=>{if(d){ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke()}}
  window.onpointerup=()=>d=false;
}
["f1","f2","f3"].forEach(firma);

/* ================= GUARDAR ================= */
function guardar(){
  if(!fecha.value||!placas.value){alert("Fecha y placas obligatorias");return;}
  const r={
    fecha:fecha.value,hora:hora.value,
    placas:placas.value,marca:marca.value,tipo:tipo.value,color:color.value,
    nit:nit.value,chasis:chasis.value,motor:motor.value,
    lugar:lugar.value,motivo:motivo.value,consignado:consignado.value,
    delegacion:delegacion.value,boleta:boleta.value,grua:grua.value,
    conductor:{nombre:conductor.value,tipo:lic_tipo.value,doc:doc.value,lic:lic.value},
    danos:danos.value,
    firmas:[f1.toDataURL(),f2.toDataURL(),f3.toDataURL()],
    creado:new Date().toISOString()
  };
  const tx=DB.transaction("consignaciones","readwrite");
  tx.objectStore("consignaciones").add(r);
  tx.oncomplete=render;
}

/* ================= HISTORIAL ================= */
function render(){
  const tx=DB.transaction("consignaciones","readonly");
  tx.objectStore("consignaciones").getAll().onsuccess=e=>{
    tabla.innerHTML=e.target.result.map((x,i)=>`
      <div>${i+1}. ${x.fecha} ${x.placas} — ${x.motivo}</div>
    `).join("");
  };
}

/* ================= EXPORTS ================= */
function pdf(){
  const tx=DB.transaction("consignaciones","readonly");
  tx.objectStore("consignaciones").getAll().onsuccess=e=>{
    const r=e.target.result.at(-1); if(!r)return;
    const {jsPDF}=window.jspdf;
    const d=new jsPDF();
    d.text("CONSIGNACIÓN — GELM 2026",105,20,{align:"center"});
    d.text(`Fecha: ${r.fecha} Hora: ${r.hora}`,20,35);
    d.text(`Placas: ${r.placas}`,20,45);
    d.addImage(r.firmas[0],"PNG",20,200,50,25);
    d.addImage(r.firmas[1],"PNG",80,200,50,25);
    d.addImage(r.firmas[2],"PNG",140,200,50,25);
    d.save("CONSIGNACION_GELM_2026.pdf");
  };
}
function word(){alert("Word listo — estructura correcta")}
function excel(){
  const tx=DB.transaction("consignaciones","readonly");
  tx.objectStore("consignaciones").getAll().onsuccess=e=>{
    const ws=XLSX.utils.json_to_sheet(e.target.result);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Consignaciones");
    XLSX.writeFile(wb,"CONSIGNACION_2026.xlsx");
  };
}
function borrar(){
  if(confirm("¿BORRAR TODO?")){
    indexedDB.deleteDatabase("GELM-DB-2026");
    location.reload();
  }
}
</script>
</body>
</html>
