<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Consignación de Vehículo — PMT | GELM 2026</title>

<link rel="manifest" href="manifest-consignacion.json">
<meta name="theme-color" content="#00ffc8">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body{
  margin:0;
  background:#050109;
  font-family:system-ui;
  color:#e9f9ff;
}

.consignacion-box{
  max-width:480px;
  margin:20px auto;
  background:#000;
  border-radius:18px;
  padding:20px;
  box-shadow:0 0 25px #00ffc8;
}

label{font-size:.7rem;color:#9cb3d8;}
input,textarea{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:12px;
  border:1px solid #00ffc8;
  background:#020616;
  color:#fff;
}

canvas{
  width:100%;
  height:180px;
  background:#fff;
  border:2px dashed #00ffc8;
  border-radius:12px;
}

button{
  padding:14px;
  margin:6px 0;
  width:100%;
  border:none;
  border-radius:999px;
  font-weight:bold;
}

.btn-save{background:#00c98a;}
.btn-pdf{background:#b000ff;color:#fff;}
.btn-word{background:#007bff;color:#fff;}
.btn-excel{background:#28a745;color:#fff;}
.btn-del{background:#ff0033;color:#fff;}
</style>
</head>

<body>

<div class="consignacion-box">
<h3>CONSIGNACIÓN PMT</h3>

<label>Fecha</label><input type="date" id="fecha">
<label>Placas</label><input id="placas">
<label>Motivo</label><input id="motivo">

<label>Firma consigna</label>
<canvas id="f1"></canvas>

<label>Firma conductor</label>
<canvas id="f2"></canvas>

<label>Firma guardián</label>
<canvas id="f3"></canvas>

<button class="btn-save" onclick="guardar()">Guardar</button>
<button class="btn-pdf" onclick="pdf()">PDF</button>
<button class="btn-word" onclick="word()">Word</button>
<button class="btn-excel" onclick="excel()">Excel</button>
<button class="btn-del" onclick="borrar()">Borrar</button>

<div id="tabla"></div>
</div>

<script>
const KEY="CONSIGNACION_TEST";
let db=JSON.parse(localStorage.getItem(KEY)||"[]");

/* ===== FIRMAS (ANDROID SEGURO) ===== */
function firma(id){
  const c=document.getElementById(id);
  const ctx=c.getContext("2d");
  let draw=false;

  function resize(){
    c.width=c.offsetWidth;
    c.height=c.offsetHeight;
    ctx.lineWidth=2;
    ctx.lineCap="round";
  }
  resize(); window.addEventListener("resize",resize);

  function pos(e){
    const r=c.getBoundingClientRect();
    return {
      x:(e.touches?e.touches[0].clientX:e.clientX)-r.left,
      y:(e.touches?e.touches[0].clientY:e.clientY)-r.top
    };
  }

  c.addEventListener("mousedown",e=>{
    draw=true; const p=pos(e);
    ctx.beginPath(); ctx.moveTo(p.x,p.y);
  });
  c.addEventListener("mousemove",e=>{
    if(!draw)return;
    const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke();
  });
  window.addEventListener("mouseup",()=>draw=false);

  c.addEventListener("touchstart",e=>{
    e.preventDefault();
    draw=true; const p=pos(e);
    ctx.beginPath(); ctx.moveTo(p.x,p.y);
  },{passive:false});
  c.addEventListener("touchmove",e=>{
    if(!draw)return;
    e.preventDefault();
    const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke();
  },{passive:false});
  c.addEventListener("touchend",()=>draw=false);
}
["f1","f2","f3"].forEach(firma);

/* ===== GUARDAR ===== */
function guardar(){
  db.push({
    fecha:fecha.value,
    placas:placas.value,
    motivo:motivo.value,
    firmas:[
      f1.toDataURL(),
      f2.toDataURL(),
      f3.toDataURL()
    ]
  });
  localStorage.setItem(KEY,JSON.stringify(db));
  render();
}

/* ===== MOSTRAR ===== */
function render(){
  tabla.innerHTML=db.map((r,i)=>`
    <div>${i+1}. ${r.fecha} - ${r.placas}</div>
  `).join("");
}
render();

/* ===== PDF ===== */
function pdf(){
  if(!db.length)return alert("No hay datos");
  const r=db.at(-1);
  const {jsPDF}=window.jspdf;
  const d=new jsPDF();
  d.text(`Fecha: ${r.fecha}`,10,10);
  d.text(`Placas: ${r.placas}`,10,20);
  d.text(`Motivo: ${r.motivo}`,10,30);
  d.addImage(r.firmas[0],"PNG",10,40,60,25);
  d.save("consignacion.pdf");
}

/* ===== WORD ===== */
function word(){
  if(!db.length)return;
  const r=db.at(-1);
  const t=`Fecha:${r.fecha}\nPlacas:${r.placas}\nMotivo:${r.motivo}`;
  const b=new Blob([t],{type:"application/msword"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b);
  a.download="consignacion.doc";
  a.click();
}

/* ===== EXCEL ===== */
function excel(){
  const ws=XLSX.utils.json_to_sheet(db);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Datos");
  XLSX.writeFile(wb,"consignacion.xlsx");
}

/* ===== BORRAR ===== */
function borrar(){
  if(confirm("¿Borrar todo?")){
    db=[];localStorage.removeItem(KEY);render();
  }
}
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js")
    .then(() => console.log("✔ Service Worker GELM activo"))
    .catch(err => console.error("SW error:", err));
}
</script>

</body>
</html>
