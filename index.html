<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Control de Asistencia — PMT</title>

<!-- CSS EXTERNO -->
<link rel="stylesheet" href="styles.css">

<!-- ICONOS PWA -->
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<!-- LIBRERÍAS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

</head>
<body>

<div class="contenedor">

  <!-- ENCABEZADO -->
  <div class="header-top">
    <div class="logo-box">
      <img src="icons/icon-192.png" alt="PMT">
    </div>

    <div class="titulos">
      <div class="titulos-linea1">CONTROL DE ASISTENCIA — PMT</div>
      <div class="titulos-linea3" id="fechaHora"></div>
      <div class="titulos-linea4">Sistema GELM 2026</div>
    </div>

    <div class="logo-box">
      <img src="icons/icon-512.png" alt="GELM">
    </div>
  </div>

  <!-- FORMULARIO -->
  <div class="panel">

    <div class="section grid">
      <div>
        <label>Nombre del elemento</label>
        <input id="nombre">
      </div>

      <div>
        <label>Cargo</label>
        <select id="cargo">
          <option>Comisario General</option>
          <option>Subdirector</option>
          <option>Subcomisario</option>
          <option>Oficial</option>
          <option>Secretario</option>
        </select>
      </div>

      <div>
        <label>Grupo</label>
        <select id="grupo">
          <option>Dirección</option>
          <option>Transportes</option>
          <option>Vía Pública</option>
          <option>Grupo A</option>
          <option>Grupo B</option>
          <option>Oficina</option>
        </select>
      </div>

      <div>
        <label>Tipo de registro</label>
        <select id="tipo">
          <option>Entrada</option>
          <option>Salida</option>
          <option>Salida Almuerzo</option>
          <option>Regreso Almuerzo</option>
          <option>Permiso</option>
          <option>Vacaciones</option>
          <option>IGSS</option>
        </select>
      </div>
    </div>

    <div class="section">
      <label>Observación (obligatoria si aplica)</label>
      <textarea id="obs" rows="2"></textarea>
    </div>

    <div class="section">
      <label>Firma del elemento</label>
      <canvas id="firma"></canvas>
    </div>

    <div class="actions">
      <button class="btn-save" onclick="guardar()">Guardar Registro</button>
      <button class="btn-pdf" onclick="pdf()">PDF Diario</button>
      <button class="btn-word" onclick="word()">Word</button>
      <button class="btn-excel" onclick="excel()">Excel</button>
      <button class="btn-del" onclick="borrar()">Borrar Todo</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Hora</th>
          <th>Nombre</th>
          <th>Cargo</th>
          <th>Grupo</th>
          <th>Tipo</th>
        </tr>
      </thead>
      <tbody id="tabla"></tbody>
    </table>

    <div class="pie">
      © 2026 — Sistema GELM — Desarrollo y propiedad intelectual reservados
    </div>

  </div>
</div>

<script>
/* ===============================
   FECHA Y HORA AUTOMÁTICA
================================ */
function actualizarHora(){
  const f=new Date();
  document.getElementById("fechaHora").innerText =
    f.toLocaleDateString("es-GT",{weekday:'long',year:'numeric',month:'long',day:'numeric'}) +
    " — " + f.toLocaleTimeString("es-GT");
}
setInterval(actualizarHora,1000);
actualizarHora();

/* ===============================
   FIRMA
================================ */
const c=document.getElementById("firma");
const ctx=c.getContext("2d");
c.width=c.offsetWidth;
c.height=140;
let dib=false;
c.onmousedown=e=>{dib=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY);}
c.onmousemove=e=>{if(dib){ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();}}
window.onmouseup=()=>dib=false;

/* ===============================
   BASE LOCAL
================================ */
const KEY="ASISTENCIA_PMT_GELM";
let db=JSON.parse(localStorage.getItem(KEY)||"[]");

/* ===============================
   GUARDAR + GOOGLE SHEETS
================================ */
function guardar(){
  const f=new Date();
  const r={
    fecha:f.toISOString().split("T")[0],
    hora:f.toLocaleTimeString("es-GT"),
    nombre:nombre.value,
    cargo:cargo.value,
    grupo:grupo.value,
    tipo:tipo.value,
    obs:obs.value,
    firma:c.toDataURL(),
    userAgent:navigator.userAgent
  };

  if(!r.nombre) return alert("Nombre obligatorio");

  db.push(r);
  localStorage.setItem(KEY,JSON.stringify(db));
  render();

  fetch("https://script.google.com/macros/s/AKfycbxxZNdpp_YF-ZoDygwRbmkAP-jsMBI3Cdsq64aozRjS6Lk0DCSvriBtRmRAoPicZ3hpNQ/exec",{
    method:"POST",
    body:JSON.stringify(r)
  });
}

/* ===============================
   RENDER TABLA
================================ */
function render(){
  tabla.innerHTML=db.map(x=>`
    <tr>
      <td>${x.fecha}</td>
      <td>${x.hora}</td>
      <td>${x.nombre}</td>
      <td>${x.cargo}</td>
      <td>${x.grupo}</td>
      <td>${x.tipo}</td>
    </tr>`).join("");
}
render();

/* ===============================
   EXPORTACIONES
================================ */
function pdf(){
  const {jsPDF}=window.jspdf;
  const d=new jsPDF();
  d.text("CONTROL DE ASISTENCIA — PMT",105,15,{align:"center"});
  db.forEach((x,i)=>{
    d.text(`${i+1}. ${x.fecha} ${x.hora} — ${x.nombre} (${x.tipo})`,20,30+i*8);
  });
  d.save("CONTROL_ASISTENCIA_PMT.pdf");
}

function word(){
  let t="CONTROL DE ASISTENCIA — PMT\n\n";
  db.forEach((x,i)=>{
    t+=`${i+1}. ${x.fecha} ${x.hora} - ${x.nombre} (${x.tipo})\n`;
  });
  const b=new Blob([t],{type:"application/msword"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b);
  a.download="CONTROL_ASISTENCIA_PMT.doc";
  a.click();
}

function excel(){
  const ws=XLSX.utils.json_to_sheet(db);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Asistencia");
  XLSX.writeFile(wb,"CONTROL_ASISTENCIA_PMT.xlsx");
}

function borrar(){
  if(confirm("¿BORRAR TODO?")){
    db=[];
    localStorage.removeItem(KEY);
    render();
  }
}
</script>

</body>
</html>
