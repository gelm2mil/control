<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONTROL DE ASISTENCIA — PMT | GELM 2026</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root{
  --c1:#00eaff;
  --c2:#00ffc8;
  --bg:#020510;
  --card:rgba(3,5,25,.96);
  --txt:#e9f9ff;
}
body{
  margin:0;
  font-family:Segoe UI,system-ui;
  background:radial-gradient(circle at 0 0,#28d7ff 0,#150027 45%,#050109 100%);
  color:var(--txt);
  display:flex;
  justify-content:center;
}
.panel{
  width:100%;
  max-width:1100px;
  margin:20px;
  padding:25px;
  background:var(--card);
  border-radius:28px;
  border:2px solid rgba(0,255,191,.35);
  box-shadow:0 0 40px rgba(0,255,191,.35);
}
h1{
  text-align:center;
  color:var(--c2);
  letter-spacing:.12em;
}
header{
  text-align:center;
  margin-bottom:15px;
}
#fechaHora{
  font-size:12px;
  opacity:.85;
}
.section{
  margin-top:18px;
  border:1px solid rgba(0,255,191,.25);
  border-radius:18px;
  padding:15px;
}
label{
  font-size:.7rem;
  color:#9cb3d8;
  text-transform:uppercase;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
}
input,select,textarea{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid var(--c1);
  background:#000;
  color:#fff;
}
textarea{resize:vertical;}
canvas{
  background:#fff;
  border-radius:10px;
  width:100%;
  height:140px;
}
.actions{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:12px;
  margin-top:20px;
}
button{
  padding:14px;
  border-radius:999px;
  border:none;
  font-weight:bold;
  cursor:pointer;
}
.btn-save{background:linear-gradient(90deg,#00eaff,#00ffc8);color:#001;}
.btn-pdf{background:linear-gradient(90deg,#8f00ff,#ff0055);color:#fff;}
.btn-word{background:#0d6efd;color:#fff;}
.btn-excel{background:#28a745;color:#fff;}
.btn-del{background:#ff0033;color:#fff;}
table{
  width:100%;
  margin-top:20px;
  border-collapse:collapse;
  font-size:.8rem;
}
th{
  background:var(--c1);
  color:#001;
  padding:8px;
}
td{
  padding:8px;
  border-bottom:1px solid rgba(0,255,191,.2);
}
footer{
  margin-top:25px;
  text-align:center;
  font-size:10px;
  opacity:.65;
}
</style>
</head>

<body>
<div class="panel">

<header>
  <h1>CONTROL DE ASISTENCIA — PMT</h1>
  <div id="fechaHora"></div>
  <div style="font-size:11px;opacity:.7;">Sistema GELM 2026</div>
</header>

<div class="section grid">
  <div>
    <label>Nombre del Elemento</label>
    <input id="nombre" placeholder="Nombre completo">
  </div>
  <div>
    <label>Cargo</label>
    <select id="cargo">
      <option>Comisario General</option>
      <option>Subdirector</option>
      <option>Subcomisario</option>
      <option>Oficial</option>
      <option>PMT</option>
    </select>
  </div>
  <div>
    <label>Grupo</label>
    <select id="grupo">
      <option>Transportes</option>
      <option>Vía Pública</option>
      <option>Operativos</option>
      <option>Administrativo</option>
    </select>
  </div>
  <div>
    <label>Tipo de Registro</label>
    <select id="tipo" onchange="verificarFirma()">
      <option>Entrada</option>
      <option>Salida a Almuerzo</option>
      <option>Regreso de Almuerzo</option>
      <option>Salida de Turno</option>
      <option>IGSS</option>
      <option>Permiso</option>
      <option>Vacaciones</option>
      <option>Comisión</option>
      <option>Ausente</option>
    </select>
  </div>
</div>

<div class="section">
  <label>Observación (obligatoria para IGSS, Permiso, Vacaciones, Comisión, Ausente)</label>
  <textarea id="obs" rows="2"></textarea>
</div>

<div class="section" id="firmaBox">
  <label>Firma del Elemento</label>
  <canvas id="firma"></canvas>
</div>

<div class="actions">
  <button class="btn-save" onclick="guardar()">Guardar Registro</button>
  <button class="btn-pdf" onclick="exportPDF()">PDF Diario</button>
  <button class="btn-word" onclick="exportWord()">Word</button>
  <button class="btn-excel" onclick="exportExcel()">Excel</button>
  <button class="btn-del" onclick="borrarTodo()">Borrar Todo</button>
</div>

<table>
<thead>
<tr>
  <th>Fecha</th>
  <th>Hora</th>
  <th>Nombre</th>
  <th>Cargo</th>
  <th>Grupo</th>
  <th>Tipo</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

<footer>
© 2025–2026 — Sistema GELM  
<br>Desarrollo, diseño y propiedad intelectual reservados
</footer>

</div>

<script>
const KEY="control_asistencia_gelm_2026";
let db=JSON.parse(localStorage.getItem(KEY)||"[]");

function actualizarHora(){
  const f=new Date();
  fechaHora.textContent=f.toLocaleDateString("es-GT",{weekday:"long",year:"numeric",month:"long",day:"numeric"})+
  " — "+f.toLocaleTimeString("es-GT");
}
setInterval(actualizarHora,1000);
actualizarHora();

// Firma
const c=firma,x=c.getContext("2d");
c.width=c.offsetWidth;c.height=c.offsetHeight;
x.lineWidth=2;x.lineCap="round";
let d=false;
c.onmousedown=e=>{d=true;x.beginPath();x.moveTo(e.offsetX,e.offsetY);}
c.onmousemove=e=>{if(d){x.lineTo(e.offsetX,e.offsetY);x.stroke();}}
window.onmouseup=()=>d=false;
c.ontouchstart=e=>{
  d=true;
  const r=c.getBoundingClientRect();
  const t=e.touches[0];
  x.beginPath();
  x.moveTo(t.clientX-r.left,t.clientY-r.top);
}
c.ontouchmove=e=>{
  e.preventDefault();
  if(!d)return;
  const r=c.getBoundingClientRect();
  const t=e.touches[0];
  x.lineTo(t.clientX-r.left,t.clientY-r.top);
  x.stroke();
}

function verificarFirma(){
  const t=tipo.value;
  firmaBox.style.display=
    ["IGSS","Permiso","Vacaciones","Comisión","Ausente"].includes(t)
    ? "none":"block";
}

function guardar(){
  if(!nombre.value) return alert("Nombre obligatorio");
  if(["IGSS","Permiso","Vacaciones","Comisión","Ausente"].includes(tipo.value) && !obs.value)
    return alert("Debe ingresar observación");

  const f=new Date();
  db.push({
    fecha:f.toISOString().slice(0,10),
    hora:f.toLocaleTimeString(),
    nombre:nombre.value,
    cargo:cargo.value,
    grupo:grupo.value,
    tipo:tipo.value,
    obs:obs.value,
    firma:c.toDataURL()
  });
  localStorage.setItem(KEY,JSON.stringify(db));
  render();
  x.clearRect(0,0,c.width,c.height);
  obs.value="";
}

function render(){
  tabla.innerHTML=db.map(r=>`
    <tr>
      <td>${r.fecha}</td>
      <td>${r.hora}</td>
      <td>${r.nombre}</td>
      <td>${r.cargo}</td>
      <td>${r.grupo}</td>
      <td>${r.tipo}</td>
    </tr>`).join("");
}
render();

function exportPDF(){
  const {jsPDF}=window.jspdf;
  const d=new jsPDF();
  d.text("CONTROL DE ASISTENCIA — PMT",105,15,{align:"center"});
  let y=30;
  db.forEach((r,i)=>{
    d.text(`${i+1}. ${r.fecha} ${r.hora} - ${r.nombre} (${r.tipo})`,20,y);
    y+=8;
  });
  d.save("CONTROL_ASISTENCIA_PMT.pdf");
}

function exportWord(){
  let html="<h2>CONTROL DE ASISTENCIA PMT</h2>";
  db.forEach(r=>{
    html+=`<p>${r.fecha} ${r.hora} — <b>${r.nombre}</b> (${r.tipo})</p>`;
  });
  const b=new Blob([html],{type:"application/msword"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b);
  a.download="CONTROL_ASISTENCIA_PMT.doc";
  a.click();
}

function exportExcel(){
  const ws=XLSX.utils.json_to_sheet(db);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Asistencia");
  XLSX.writeFile(wb,"CONTROL_ASISTENCIA_PMT.xlsx");
}

function borrarTodo(){
  if(confirm("¿BORRAR TODOS LOS REGISTROS?")){
    db=[];
    localStorage.removeItem(KEY);
    render();
  }
}
</script>
</body>
</html>
