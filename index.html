<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Control de Asistencia — PMT</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root{
  --c1:#00eaff;
  --c2:#00ffc8;
  --bg:#020510;
  --card:rgba(3,5,25,.96);
  --txt:#e9f9ff;
}
body{
  margin:0;
  font-family:Segoe UI,system-ui;
  background:radial-gradient(circle at 0 0,#28d7ff 0,#150027 45%,#050109 100%);
  color:var(--txt);
  display:flex;
  justify-content:center;
}
.panel{
  width:100%;
  max-width:1000px;
  margin:20px;
  padding:25px;
  background:var(--card);
  border-radius:28px;
  border:2px solid rgba(0,255,191,.35);
  box-shadow:0 0 40px rgba(0,255,191,.35);
}
h1{
  text-align:center;
  color:var(--c2);
  letter-spacing:.15em;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
}
h1 img{width:40px;height:40px}
.section{
  margin-top:18px;
  border:1px solid rgba(0,255,191,.25);
  border-radius:18px;
  padding:15px;
}
label{
  font-size:.7rem;
  color:#9cb3d8;
  text-transform:uppercase;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
}
input,select,textarea{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid var(--c1);
  background:#000;
  color:#fff;
}
textarea{resize:vertical;}
canvas{
  background:#fff;
  border-radius:10px;
  width:100%;
  height:140px;
}
.actions{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:12px;
  margin-top:20px;
}
button{
  padding:14px;
  border-radius:999px;
  border:none;
  font-weight:bold;
  cursor:pointer;
}
.btn-save{background:linear-gradient(90deg,#00eaff,#00ffc8);color:#001;}
.btn-pdf{background:linear-gradient(90deg,#8f00ff,#ff0055);color:#fff;}
.btn-word{background:#0d6efd;color:#fff;}
.btn-excel{background:#28a745;color:#fff;}
.btn-del{background:#ff0033;color:#fff;}
table{
  width:100%;
  margin-top:20px;
  border-collapse:collapse;
  font-size:.8rem;
}
th{
  background:var(--c1);
  color:#001;
  padding:8px;
}
td{
  padding:8px;
  border-bottom:1px solid rgba(0,255,191,.2);
}
footer{
  margin-top:20px;
  text-align:center;
  font-size:10px;
  opacity:.6;
}
</style>
</head>

<body>
<div class="panel">

<h1>
  <img src="icons/icon-192.png">
  CONTROL DE ASISTENCIA — PMT
  <img src="icons/icon-512.png">
</h1>

<div style="text-align:center;font-size:12px;opacity:.8" id="fechaHora"></div>

<div class="section grid">
  <div>
    <label>Nombre</label>
    <input id="nombre">
  </div>
  <div>
    <label>Cargo</label>
    <select id="cargo">
      <option>Subcomisario</option>
      <option>Oficial</option>
      <option>Secretario</option>
      <option>Agente</option>
    </select>
  </div>
  <div>
    <label>Grupo</label>
    <select id="grupo">
      <option>Director</option>
      <option>Subdirector</option>
      <option>Transportes</option>
      <option>Vía Pública</option>
      <option>Grupo A</option>
      <option>Grupo B</option>
      <option>Oficina</option>
    </select>
  </div>
  <div>
    <label>Tipo de Registro</label>
    <select id="tipo">
      <option>Entrada</option>
      <option>Salida</option>
      <option>Almuerzo</option>
      <option>Regreso</option>
      <option>IGSS</option>
      <option>Permiso</option>
      <option>Vacaciones</option>
      <option>Ausente</option>
    </select>
  </div>
</div>

<div class="section">
<label>Observación</label>
<textarea id="obs"></textarea>
</div>

<div class="section">
<label>Firma</label>
<canvas id="firma"></canvas>
</div>

<div class="actions">
<button class="btn-save" onclick="guardar()">Guardar</button>
<button class="btn-pdf" onclick="pdf()">PDF Diario</button>
<button class="btn-word" onclick="word()">Word</button>
<button class="btn-excel" onclick="excel()">Excel</button>
<button class="btn-del" onclick="borrar()">Borrar Todo</button>
</div>

<table>
<thead>
<tr><th>Fecha</th><th>Hora</th><th>Nombre</th><th>Cargo</th><th>Grupo</th><th>Tipo</th></tr>
</thead>
<tbody id="tabla"></tbody>
</table>

<footer>© 2026 — Sistema GELM — Uso interno autorizado</footer>
</div>

<script>
const KEY="asistencia_gelm";
let db=JSON.parse(localStorage.getItem(KEY)||"[]");

const fechaHora=document.getElementById("fechaHora");
setInterval(()=>{
  const d=new Date();
  fechaHora.textContent=d.toLocaleString("es-GT");
},1000);

const canvas=firma;
const ctx=canvas.getContext("2d");
canvas.width=canvas.offsetWidth;
canvas.height=canvas.offsetHeight;
ctx.lineWidth=2;
let draw=false;
canvas.onmousedown=e=>{draw=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY);}
canvas.onmousemove=e=>{if(draw){ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();}}
window.onmouseup=()=>draw=false;

function guardar(){
  const d=new Date();
  const r={
    fecha:d.toISOString().split("T")[0],
    hora:d.toLocaleTimeString("es-GT"),
    nombre:nombre.value,
    cargo:cargo.value,
    grupo:grupo.value,
    tipo:tipo.value,
    obs:obs.value,
    firma:canvas.toDataURL()
  };
  if(!r.nombre)return alert("Nombre obligatorio");
  db.push(r);
  localStorage.setItem(KEY,JSON.stringify(db));
  render();
}

function render(){
  tabla.innerHTML=db.map(x=>`
    <tr>
      <td>${x.fecha}</td>
      <td>${x.hora}</td>
      <td>${x.nombre}</td>
      <td>${x.cargo}</td>
      <td>${x.grupo}</td>
      <td>${x.tipo}</td>
    </tr>`).join("");
}
render();

function pdf(){
  const {jsPDF}=window.jspdf;
  const d=new jsPDF();
  d.text("CONTROL DE ASISTENCIA — PMT",105,15,{align:"center"});
  db.forEach((x,i)=>{
    d.text(`${i+1}. ${x.fecha} ${x.hora} - ${x.nombre} (${x.tipo})`,20,30+i*8);
  });
  d.save("CONTROL_ASISTENCIA_PMT.pdf");
}

function word(){
  let t="CONTROL DE ASISTENCIA — PMT\n\n";
  db.forEach((x,i)=>{
    t+=`${i+1}. ${x.fecha} ${x.hora} - ${x.nombre} (${x.tipo})\n`;
  });
  const b=new Blob([t],{type:"application/msword"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b);
  a.download="CONTROL_ASISTENCIA_PMT.doc";
  a.click();
}

function excel(){
  const ws=XLSX.utils.json_to_sheet(db);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Asistencia");
  XLSX.writeFile(wb,"CONTROL_ASISTENCIA_PMT.xlsx");
}

function borrar(){
  if(confirm("¿BORRAR TODO?")){
    db=[];
    localStorage.removeItem(KEY);
    render();
  }
}
</script>

</body>
</html>
